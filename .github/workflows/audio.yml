name: Generate word audio

on:
  workflow_dispatch:
    inputs:
      voice:
        description: Voice
        type: choice
        default: en-US-AvaMultilingualNeural
        options:
          - en-US-AvaMultilingualNeural
          - en-US-AndrewMultilingualNeural
          - en-US-EmmaMultilingualNeural
          - en-US-BrianMultilingualNeural
          - en-US-AriaNeural
          - en-US-GuyNeural
          - en-US-JennyNeural
          - en-GB-SoniaNeural
          - en-GB-RyanNeural
      engine:
        description: "auto = ElevenLabs if it has credits, free = Microsoft voice only (no credits needed)"
        type: choice
        default: auto
        options:
          - auto
          - free
      rate:
        description: "Speed (e.g. -20% slower, -10% default, +0% normal)"
        type: string
        default: "-10%"
      force:
        description: Re-create ALL files (needed after changing voice or speed)
        type: boolean
        default: false
  push:
    branches: [main, master]
    paths:
      - index.html
      - scripts/generate_audio.py

permissions:
  contents: write

jobs:
  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install edge-tts gTTS
      - run: python scripts/generate_audio.py
        env:
          TTS_VOICE: ${{ inputs.voice }}
          TTS_RATE: ${{ inputs.rate }}
          FORCE: ${{ inputs.force }}
          MAX_MINUTES: "32"
          ELEVENLABS_API_KEY: ${{ inputs.engine != 'free' && secrets.ELEVENLABS_API_KEY || '' }}
      - name: Commit audio files
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A audio
          if git diff --cached --quiet; then
            echo "No audio changes"
          else
            git commit -m "Update word audio"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push
          fi
