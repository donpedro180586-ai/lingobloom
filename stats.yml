name: Stats to Telegram

on:
  schedule:
    - cron: "0 17 * * *"   # every day at 17:00 UTC (18:00 in Germany in winter)
  workflow_dispatch:       # also: Actions tab -> Stats to Telegram -> Run workflow

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Send stats to Telegram
        env:
          GC_CODE: ${{ secrets.GOATCOUNTER_CODE }}
          GC_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 - <<'PY'
          import os, json, time, urllib.request, urllib.parse, urllib.error, datetime as dt

          code, tok = os.environ["GC_CODE"].strip(), os.environ["GC_TOKEN"].strip()
          tg, chat = os.environ["TG_TOKEN"].strip(), os.environ["TG_CHAT"].strip()

          def gc(path, **q):
              url = f"https://{code}.goatcounter.com/api/v0/{path}?" + urllib.parse.urlencode(q)
              req = urllib.request.Request(url, headers={"Authorization": "Bearer " + tok})
              with urllib.request.urlopen(req, timeout=30) as r:
                  data = json.load(r)
              time.sleep(0.6)
              return data

          def send(text):
              body = urllib.parse.urlencode({"chat_id": chat, "text": text}).encode()
              urllib.request.urlopen(urllib.request.Request(f"https://api.telegram.org/bot{tg}/sendMessage", data=body), timeout=30).read()

          now = dt.datetime.now(dt.timezone.utc)
          iso = lambda d: d.strftime("%Y-%m-%dT%H:%M:%SZ")
          periods = [
              ("За 24 часа", now - dt.timedelta(hours=24)),
              ("За 7 дней", now - dt.timedelta(days=7)),
              ("За всё время", dt.datetime(2020, 1, 1, tzinfo=dt.timezone.utc)),
          ]
          events = [("tg-open", "✈️ Открыли в Telegram"), ("lesson-done", "📘 Уроков пройдено"), ("game-played", "🎮 Игр сыграно")]

          try:
              out = ["📊 English: статистика"]
              for title, start in periods:
                  a = dict(start=iso(start), end=iso(now))
                  total = gc("stats/total", **a).get("total", 0)
                  hits = gc("stats/hits", limit=100, daily="false", **a).get("hits", [])
                  ev = {str(h.get("path", "")).lstrip("/"): h.get("count", 0) for h in hits if h.get("event")}
                  out.append("")
                  out.append(title)
                  out.append(f"👥 Визиты: {total}")
                  out += [f"{label}: {ev.get(key, 0)}" for key, label in events]
              send("\n".join(out))
          except urllib.error.HTTPError as e:
              send(f"⚠️ Не вышло получить статистику (ошибка {e.code}). Проверь GOATCOUNTER_CODE и токен.")
              raise
          PY
