<!DOCTYPE html>
<html lang="ru" data-theme="royal">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Learn English</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Anton&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0b0d;--surface:#131316;--text:#f3efe7;--muted:#8d8a84;--line:rgba(243,239,231,.09);--line2:rgba(243,239,231,.18);--glass:#131316;--ok:#7fb89a;--bad:#c97a7a;--a:#c8a96a;--a2:#b08d4c;--g:#d8bf8a;--gt:rgba(200,169,106,.1);--serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;--sans:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
[data-theme=emerald]{--a:#8fb8a4;--a2:#6f9c87;--g:#b9d6c8;--gt:rgba(143,184,164,.1)}
[data-theme=rose]{--a:#d4a5a5;--a2:#b98585;--g:#ecc9c9;--gt:rgba(212,165,165,.1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.45;padding:0 0 110px;min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
.bg{position:fixed;inset:0;z-index:-1;background:radial-gradient(900px 500px at 50% -15%,var(--gt),transparent 70%),var(--bg)}
.bg i{display:none}
#cf{position:fixed;inset:0;pointer-events:none;z-index:50}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(14px + env(safe-area-inset-top)) 20px 12px;background:linear-gradient(var(--bg) 70%,transparent)}
.logo{font-family:var(--serif);font-size:19px;font-weight:600;letter-spacing:.28em;text-transform:uppercase;color:var(--g)}
.hud{display:flex;gap:6px;align-items:center}
.pill{border:1px solid var(--line);border-radius:20px;padding:6px 12px;font-size:12px;font-weight:500;letter-spacing:.03em;white-space:nowrap;color:var(--muted)}
.pill.gold{color:var(--g);border-color:rgba(200,169,106,.3)}
.mbtn{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--text);font-size:14px;cursor:pointer;padding:0}
main{padding:6px 20px;max-width:560px;margin:0 auto;animation:in .4s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
h2{font-family:var(--serif);font-size:26px;font-weight:600;letter-spacing:.01em;margin:28px 0 10px}
.muted{color:var(--muted);font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;margin:14px 0}
.hero{background:linear-gradient(160deg,var(--gt),transparent 65%),var(--surface);border-color:rgba(200,169,106,.28)}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.center{text-align:center}
.en{font-family:var(--serif);font-size:48px;font-weight:600;line-height:1.1;margin:10px 0;color:var(--text);overflow-wrap:anywhere}
.en2{font-family:var(--serif);font-size:30px;font-weight:600;margin:6px 0;overflow-wrap:anywhere}
.btn{border:0;background:linear-gradient(180deg,var(--g),var(--a2));color:#17130a;padding:14px 20px;border-radius:12px;font-family:var(--sans);font-size:14px;font-weight:600;letter-spacing:.04em;cursor:pointer;transition:transform .12s,opacity .2s}
.btn:hover{opacity:.92}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;border:1px solid var(--line2);color:var(--text)}
.btn.ok{background:var(--ok);color:#0c1a13}
.btn.bad{background:var(--bad);color:#210d0d}
.btn.gold{background:linear-gradient(180deg,var(--g),var(--a2));color:#17130a}
.row{display:flex;gap:10px;margin-top:14px}.row .btn{flex:1}
.icon{border:1px solid var(--line2);background:transparent;color:var(--text);width:44px;height:44px;border-radius:50%;font-size:17px;cursor:pointer}
.back{border:0;background:none;color:var(--muted);font-size:13px;letter-spacing:.04em;cursor:pointer;padding:6px 0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:transparent;color:var(--muted);padding:8px 16px;border-radius:20px;font-size:13px;font-weight:500;cursor:pointer;transition:.2s}
.chip.on{border-color:var(--a);background:var(--gt);color:var(--g)}
.search{width:100%;padding:13px 16px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--text);font-size:15px;outline:none;margin:6px 0;transition:border-color .2s}
.search:focus{border-color:var(--a)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
.letter{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 0 10px;text-align:center;font-family:var(--serif);font-size:30px;font-weight:600;cursor:pointer;transition:transform .12s,border-color .2s}
.letter small{display:block;font-family:var(--sans);font-size:11px;font-weight:400;color:var(--muted);margin-top:2px}
.letter:active{transform:scale(.95)}
.letter.seen{border-color:rgba(200,169,106,.45);color:var(--g)}
.word{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px}
.word b{font-family:var(--serif);font-size:22px;font-weight:600}
.word .acts{display:flex;gap:6px}
.star{color:var(--muted)}.star.on{color:var(--g)}
.bar{height:4px;background:var(--line);border-radius:4px;overflow:hidden;margin:10px 0}
.bar div{height:100%;background:linear-gradient(90deg,var(--a2),var(--g));border-radius:4px;transition:width .5s}
.ring{--p:0;width:92px;height:92px;border-radius:50%;background:conic-gradient(var(--g) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;flex:none}
.ring>div{width:82px;height:82px;border-radius:50%;background:var(--surface);display:grid;place-items:center;text-align:center;font-family:var(--serif);font-weight:600;font-size:22px;line-height:1.1}
.ring small{display:block;font-family:var(--sans);font-size:10px;font-weight:400;color:var(--muted)}
.games{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.game{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;cursor:pointer;text-align:left;color:var(--text);transition:transform .15s,border-color .2s}
.game:active{transform:scale(.97)}
.game:hover{border-color:rgba(200,169,106,.5)}
.game .e{font-size:26px}.game b{display:block;margin:10px 0 2px;font-family:var(--serif);font-size:19px;font-weight:600}
.game span{font-size:12px;color:var(--muted)}
.opt{display:block;width:100%;text-align:left;margin:9px 0;padding:16px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--text);font-size:16px;cursor:pointer;transition:transform .12s,border-color .2s,background .2s}
.opt:hover{border-color:var(--line2)}
.opt:active{transform:scale(.99)}
.opt.ok{background:rgba(127,184,154,.14);border-color:var(--ok);animation:pop .4s}
.opt.bad{background:rgba(201,122,122,.14);border-color:var(--bad);animation:shake .4s}
@keyframes pop{50%{transform:scale(1.02)}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.shake{animation:shake .4s}
.prompt{padding:26px 18px}
.combo{color:var(--g);font-weight:600;font-size:13px;letter-spacing:.06em}
.fc{perspective:900px;height:240px;margin:16px 0;cursor:pointer}
.fc .in{position:relative;height:100%;transition:transform .6s cubic-bezier(.3,1.1,.4,1);transform-style:preserve-3d}
.fc.f .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:20px;border:1px solid rgba(200,169,106,.3);background:linear-gradient(160deg,var(--gt),transparent 70%),var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:18px}
.face.back{transform:rotateY(180deg);background:linear-gradient(160deg,rgba(200,169,106,.16),transparent 70%),var(--surface)}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.m{padding:16px 8px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--text);font-size:15px;cursor:pointer;min-height:56px;transition:all .2s}
.m.sel{border-color:var(--a);background:var(--gt)}
.m.done{opacity:.4;background:rgba(127,184,154,.14);border-color:var(--ok);pointer-events:none}
.m.bad{background:rgba(201,122,122,.16);border-color:var(--bad);animation:shake .4s}
.slots,.tiles{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:16px 0}
.slot,.tile{width:44px;height:54px;border-radius:12px;font-family:var(--serif);font-size:26px;font-weight:600;color:var(--text);cursor:pointer}
.slot{border:1px dashed var(--line2);background:transparent}
.slot.f{border:1px solid var(--a);background:var(--gt)}
.slot.okk{border-color:var(--ok);background:rgba(127,184,154,.16)}
.tile{border:1px solid var(--line);background:var(--surface)}
.tile.used{opacity:.15}
.big{font-family:var(--serif);font-size:60px;font-weight:600}
.stars{font-size:30px;letter-spacing:6px;margin:6px 0;color:var(--g)}
.ach{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.a{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 6px;text-align:center;font-size:11px;color:var(--muted)}
.a .e{font-size:26px;filter:grayscale(1);opacity:.3}
.a.on{border-color:rgba(200,169,106,.45);color:var(--text)}
.a.on .e{filter:none;opacity:1}
.set{display:flex;justify-content:space-between;align-items:center;padding:14px 0;gap:12px;border-bottom:1px solid var(--line)}
.set:last-child{border-bottom:0}
.set input[type=range]{width:50%;accent-color:var(--a)}
.sw{position:relative;width:46px;height:26px;border-radius:16px;background:var(--line2);border:0;cursor:pointer;flex:none;transition:.25s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--text);transition:.25s}
.sw.on{background:var(--a)}.sw.on::after{left:23px;background:#17130a}
.themes{display:flex;gap:12px}
.th{width:30px;height:30px;border-radius:50%;border:0;cursor:pointer;transition:box-shadow .2s}
.th.on{box-shadow:0 0 0 2px var(--bg),0 0 0 3px var(--g)}
#toast{position:fixed;top:calc(66px + env(safe-area-inset-top));left:50%;transform:translate(-50%,-30px);opacity:0;z-index:60;background:var(--surface);border:1px solid rgba(200,169,106,.4);border-radius:14px;padding:12px 20px;font-size:13px;font-weight:500;letter-spacing:.02em;transition:.35s;pointer-events:none;max-width:90%;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.6)}
#toast.show{opacity:1;transform:translate(-50%,0)}
nav{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:30;display:flex;gap:2px;padding:6px;background:rgba(14,14,16,.88);border:1px solid var(--line);border-radius:22px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 12px 40px rgba(0,0,0,.6);width:calc(100% - 28px);max-width:440px}
nav button{flex:1;border:0;background:none;color:var(--muted);padding:9px 1px 8px;font-family:var(--sans);font-size:10px;letter-spacing:.05em;cursor:pointer;border-radius:16px;transition:.25s}
nav button .ic{display:grid;place-items:center;height:22px;margin-bottom:3px;font-family:var(--serif);font-size:19px;font-weight:600;line-height:1}
nav button svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--g);background:var(--gt)}
.lesson{display:flex;align-items:center;gap:14px;width:100%;text-align:left;margin:10px 0;padding:14px;border-radius:16px;border:1px solid var(--line);background:var(--surface);color:var(--text);cursor:pointer;transition:transform .12s,border-color .2s}
.lesson:active{transform:scale(.99)}
.lesson .le{font-size:22px;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line2);flex:none;font-family:var(--serif);font-weight:600}
.lesson .lt{flex:1}.lesson .lt b{display:block;font-size:15px;font-weight:600}.lesson .lt span{font-size:12px;color:var(--muted)}
.lesson .ls{font-size:13px;color:var(--g)}
.lesson.cur{border-color:rgba(200,169,106,.55);box-shadow:0 0 28px var(--gt)}
.lesson.done .le{border-color:var(--ok);color:var(--ok)}
.lesson.lock{opacity:.45}
.ex{margin-top:14px;padding:14px;border-radius:14px;background:rgba(255,255,255,.03);border:1px dashed var(--line2)}
.tip{background:var(--gt);border-left:2px solid var(--a);border-radius:4px 14px 14px 4px;padding:12px 16px;font-size:14px;margin:12px 0;line-height:1.5}
.note{font-size:12px;color:var(--muted);text-align:center;margin:8px 0;line-height:1.5}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
main.pgin>*{animation:rise .55s cubic-bezier(.2,.8,.2,1) backwards}
main.pgin>*:nth-child(2){animation-delay:.05s}main.pgin>*:nth-child(3){animation-delay:.1s}main.pgin>*:nth-child(4){animation-delay:.15s}main.pgin>*:nth-child(5){animation-delay:.2s}main.pgin>*:nth-child(6){animation-delay:.25s}main.pgin>*:nth-child(n+7){animation-delay:.3s}
@media(prefers-reduced-motion:reduce){main.pgin>*{animation:none}}
main.pgin h2::after{content:"";display:block;height:1px;width:0;background:var(--a);margin-top:8px;animation:ln .8s .2s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes ln{to{width:48px}}
.msvg{display:block;width:100%;height:auto;border-radius:14px}
.mrow{display:flex;gap:10px;overflow-x:auto;padding:4px 0 2px;scrollbar-width:none}.mrow::-webkit-scrollbar{display:none}
.mth{flex:none;width:96px;border-radius:12px;overflow:hidden;border:1px solid var(--line);cursor:pointer;transition:transform .12s}.mth:active{transform:scale(.95)}
.mm{position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:70;display:none;align-items:center;justify-content:center;padding:16px}.mm.on{display:flex}
.mmbox{background:var(--surface);border:1px solid var(--line2);border-radius:20px;max-width:400px;width:100%;max-height:92vh;overflow:auto;padding:14px}
.tile.w{width:auto;min-width:44px;height:44px;padding:0 12px;font-family:var(--sans);font-size:16px}
.wl{min-height:56px;align-items:center;border-bottom:1px dashed var(--line2)}
.mbtn{position:relative}
#hDot{position:absolute;top:-2px;right:-2px;width:10px;height:10px;border-radius:50%;background:var(--bad);border:2px solid var(--bg);display:none}
#hMeme{border-color:rgba(200,169,106,.4)}
.fl{animation:fl 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes fl{50%{transform:translateY(-6px) rotate(3deg)}}
@media(prefers-reduced-motion:reduce){.fl{animation:none}}
.mban{margin:4px 0 14px;border-radius:18px;overflow:hidden;border:1px solid rgba(200,169,106,.35);cursor:pointer;box-shadow:0 10px 30px rgba(0,0,0,.45);transition:transform .12s}.mban:active{transform:scale(.985)}.mban svg{display:block;width:100%;height:auto}
.pl{animation:pl 2.6s ease-out infinite;transform-box:fill-box;transform-origin:center}.pl2{animation-delay:.9s}.pl3{animation-delay:1.8s}
@keyframes pl{0%{opacity:.9;transform:scale(.7)}100%{opacity:0;transform:scale(1.3)}}
.fy{animation:fy 3s ease-in-out infinite}@keyframes fy{50%{transform:translateY(-10px)}}
.sp{animation:sp 40s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes sp{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.pl,.fy,.sp{animation:none}}
.fk{animation:fk .9s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes fk{to{transform:scaleY(1.28) scaleX(.9)}}
.dr{animation:dr 2s ease-in infinite}@keyframes dr{0%{opacity:0}20%{opacity:1}100%{opacity:0;margin-top:34px}}
@media(prefers-reduced-motion:reduce){.fk,.dr{animation:none}}

/* --- "Спой на английском": look of the promo video --- */
.sg-file{display:block;text-align:center;cursor:pointer;padding:22px 16px;border:1px solid var(--line);border-radius:18px;background:var(--surface);margin:14px 0;font-size:18px;overflow-wrap:anywhere}
.sg-file.ok{color:var(--ok);font-weight:500;border-color:rgba(127,184,154,.35)}
.sg-file small{display:block;color:var(--muted);font-size:11px;margin-top:5px;font-weight:400}
.sg-h{font-family:var(--serif);font-size:23px;font-weight:600;display:block}
.wv{display:flex;align-items:flex-end;gap:3px;height:104px;margin:16px 0 8px;padding-top:12px;position:relative;touch-action:none;cursor:pointer;user-select:none;-webkit-user-select:none;outline:none}
.wv i{flex:1;min-width:2px;background:#4a4843;border-radius:2px;transition:background .15s}
.wv i.on{background:var(--g)}
.wv .mk{position:absolute;top:0;height:3px;background:var(--g);border-radius:2px;pointer-events:none}
.wv:focus-visible{box-shadow:0 0 0 2px var(--a)}
.pbtns{display:flex;gap:10px;margin-top:14px}
.pbtns .btn{flex:1;padding:13px 8px}
.lcard{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 16px 12px;margin:14px 0}
.lru{font-size:13px;color:var(--muted);margin-bottom:10px}
.lin{display:block;width:100%;background:transparent;border:0;border-bottom:1px solid transparent;outline:0;color:var(--text);font-family:var(--sans);font-size:17px;padding:0 34px 22px 0;margin:0;border-radius:0}
.lin:focus{border-bottom-color:var(--a)}
.spk{position:absolute;right:12px;bottom:10px;background:none;border:0;font-size:18px;cursor:pointer;padding:4px;opacity:.85}
.lyr .ln{text-align:center;margin:14px 0;opacity:.8;transition:opacity .25s}
.lyr .ln .le{font-size:17px;line-height:1.3;transition:font-size .25s,color .25s}
.lyr .ln .lr{font-size:12px;color:var(--muted);margin-top:2px}
.lyr.live .ln{opacity:.4}
.lyr .ln.cur{opacity:1}
.lyr .ln.cur .le{color:var(--g);font-size:23px;font-weight:600}
.rrow{display:flex;align-items:center;gap:8px;margin:18px 4px 8px;font-size:17px}
.rdot{width:11px;height:11px;border-radius:50%;background:#55524c;display:inline-block}
.rdot.on{background:var(--bad);animation:rblink 1s infinite}
@keyframes rblink{50%{opacity:.35}}
.mv{display:flex;align-items:flex-end;gap:4px;height:88px;margin:6px 4px 10px}
.mv i{flex:1;border-radius:2px;background:linear-gradient(180deg,var(--g),var(--a2));height:6%;transition:height .09s linear}
.adv{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.adv summary{cursor:pointer;color:var(--muted);font-size:13px;list-style:none;padding:4px 0}
.adv summary::-webkit-details-marker{display:none}
.adv summary::before{content:"＋ ";color:var(--g)}
.adv[open] summary::before{content:"－ "}
</style>
</head>
<body>
<div class="bg"><i></i><i></i><i></i></div>
<canvas id="cf"></canvas>
<div id="toast"></div>
<div class="mm" id="mm"><div class="mmbox" id="mmbox"></div></div>
<header class="top">
  <div class="logo">English</div>
  <div class="hud">
    <span class="pill" id="hStreak">🔥 0</span>
    <span class="pill gold" id="hLv">Lv 1</span>
    <button class="mbtn" id="hMusic" aria-label="Музыка">🎵</button>
  </div>
</header>
<main id="view"></main>
<nav id="tabs">
  <button data-t="home" class="on"><span class="ic"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg></span>Главная</button>
  <button data-t="learn"><span class="ic"><svg viewBox="0 0 24 24"><path d="M4 5.5C6.5 4.5 9.5 4.5 12 6c2.5-1.5 5.5-1.5 8-.5V19c-2.5-1-5.5-1-8 .5-2.5-1.5-5.5-1.5-8-.5z"/><path d="M12 6v13.5"/></svg></span>Уроки</button>
  <button data-t="alpha"><span class="ic">Aa</span>Алфавит</button>
  <button data-t="words"><span class="ic"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="2"/><path d="M8 10h8M8 14h5"/></svg></span>Слова</button>

:[0,1,2,3,4],"tip":"В английском 26 букв: 5 гласных (A, E, I, O, U) и 21 согласная. Название буквы (эй, би, си) — это не всегда то, как она звучит в слове."},{"id":"a2","sec":"Алфавит","e":"F","t":"Буквы F–J","d":"F G H I J","type":"l","items":[5,6,7,8,9],"tip":"Не путайте G («джи») и J («джей»). Буква H называется «эйч», а в слове house звучит как лёгкий выдох."},{"id":"a3","sec":"Алфавит","e":"K","t":"Буквы K–O","d":"K L M N O","type":"l","items":[10,11,12,13,14],"tip":"M («эм») и N («эн») звучат похоже, слушайте внимательно. Буква O называется «оу»."},{"id":"a4","sec":"Алфавит","e":"P","t":"Буквы P–T","d":"P Q R S T","type":"l","items":[15,16,17,18,19],"tip":"Q почти всегда идёт вместе с U: queen. Английская R не раскатистая, язык не касается нёба."},{"id":"a5","sec":"Алфавит","e":"Z","t":"Буквы U–Z","d":"U V W X Y Z","type":"l","items":[20,21,22,23,24,25],"tip":"W называется «дабл-ю», то есть «двойное U». В американском английском Z читается «зи», в британском — «зед»."},{"id":"w1","sec":"Слова","e":"👋","t":"Привет!","d":"Приветствия и вежливость","type":"w","items":["Hello","Goodbye","Please","Thank you","Sorry","Yes","No","Good morning"],"tip":"Hello подходит всегда. Hi — короче и неформально. Please и Thank you в английском говорят очень часто."},{"id":"w2","sec":"Слова","e":"🙂","t":"О себе","d":"Имя, дела, семья","type":"w","items":["My name is","How are you?","Fine","I","You","Friend","Mother","Father"],"tip":"В английском нельзя пропускать глагол: I am a student — «Я есть студент». Нельзя сказать «I student»."},{"id":"m1","sec":"Мемы 🔥","e":"😎","t":"Сленг: харизма","d":"rizz, aura, goated…","type":"w","items":["rizz","aura","it's giving","goated","no cap","delulu"],"tip":"Это сленг Gen Z из TikTok: rizz — харизма, aura — ваша «аура» (за позор её теряют), it's giving — «это вайб». В чатах так говорят, а на экзамене лучше обычный английский."},{"id":"w3","sec":"Слова","e":"1️⃣","t":"Числа 1–5","d":"one … five","type":"w","items":["one","two","three","four"," function confetti(n){
  n=n||110;const c=$("#cf"),x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;
  const cols=["#d8bf8a","#c8a96a","#f3efe7","#b08d4c","#ecdcb5"];
  const P=Array.from({length:n},()=>({x:innerWidth/2,y:innerHeight*.4,vx:(Math.random()-.5)*15,vy:-Math.random()*14-3,s:Math.random()*8+4,c:cols[Math.random()*5|0],r:Math.random()*6,vr:(Math.random()-.5)*.4,l:1}));
  (function f(){
    x.clearRect(0,0,c.width,c.height);let alive=0;
    P.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.l-=.007;
      if(p.l>0&&p.y<c.height){alive++;x.save();x.globalAlpha=p.l;x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()}});
    if(alive)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height);
  })();
}

/* ---- generic multiple choice ---- */
function choiceGame(id,title,items,make){
  let i=0,score=0,combo=0,locked=false;const n=items.length;
  function step(){
    if(i>=n)return finish(id,title,score,n);
    const q=make(items[i]);
    view.innerHTML=`<button class="back" id="bk">← Игры</button>
    <div class="between"><span class="muted">${title} · ${i+1}/${n}</span><span class="combo">${combo>1?"🔥 комбо x"+combo:""}</span></div>
    <div class="bar"><div style="width:${i/n*100}%"></div></div>
    <div class="card center prompt">${q.prompt}${q.say?'<button class="icon" id="sp" style="margin-top:8px">🔊</button>':''}</div>
    <div>${q.opts.map((o,k)=>`<button class="opt" data-k="${k}">${o.t}</button>`).join("")}</div>`;
    $("#bk").onclick=Play;
    if(q.say){$("#sp").onclick=()=>say(q.say);if(q.auto)later(()=>say(q.say),350)}
    locked=false;
    const btns=view.querySelectorAll(".opt");
    btns.forEach(b=>b.onclick=()=>{
      if(locked)return;locked=true;
      const o=q.opts[b.dataset.k];
      if(o.ok){b.classList.add("ok");score++;combo++;answer(true);if(combo>=3){gainXP(combo>=5?5:2);SFX.coin()}}
      else{b.classList.add("bad");combo=0;answer(false);btns.forEach((x,k)=>{if(q.opts[k].ok)x.classList.add("ok")})}
      later(()=>{i++;step()},1000);
    });
  }
  step();
}
function finish(id,title,score,max){stat("game-played","Игра сыграна");
  const ratio=score/max;
  if(S.bests[id]==null||score>S.bests[id])S.bests[id]=score;
  if(score===max)S.flags.perfect=1;
  const bonus=score*3;gainXP(bonus);
  if(ratio>=.8){SFX.level();confetti()}
  save();checkAch();
  const st=ratio>=.9?3:ratio>=.6?2:ratio>=.3?1:0;
  view.innerHTML=`<div class="card center hero" style="padding:28px 16px">
    <div class="muted">${title}</div>
    <div class="stars">${"⭐".repeat(st)}${"☆".repeat(3-st)}</div>
    <div class="big">${score}/${max}</div>
    <div class="muted" style="margin-top:6px">${ratio>=.8?"Отлично! Excellent! 🎉":ratio>=.5?"Неплохо, продолжайте 👍":"Повторите слова и попробуйте снова 💪"}</div>
    <div class="muted" style="margin-top:6px">Бонус +${bonus} XP</div></div>
    <div class="row"><button class="btn" id="again">Ещё раз</button><button class="btn ghost" id="menu">Игры</button></div>`;
  $("#again").onclick=()=>startGame(id);$("#menu").onclick=Play;
}

let deck=[],di=0,deckT="";
function cardsGame(){
  redraw=cardsGame;
  const pool=ALL.filter(w=>topic==="★"?S.fav.includes(w.en):(topic==="All"||w.topic===topic));
  if(!pool.length){view.innerHTML=`<button class="back" id="bk">← Игры</button>${chips(true)}<div class="card center muted">Здесь пока нет карточек. Сохраняйте слова через ☆ в разделе «Слова».</div>`;$("#bk").onclick=()=>{redraw=null;Play()};return}
  if(!deck.length||deckT!==topic||deck.some(w=>!pool.includes(w))){deck=shuffle(pool);di=0;deckT=topic}
  if(di>=deck.length){deck=shuffle(deck);di=0}
  const w=deck[di];

function matchGame(){

/* ---- word builder ---- */
function buildGame(){
  const pool=shuffle(ALL.filter(w=>/^[a-z]{3,}$/i.test(w.en))).slice(0,6);
  let r=0,score=0;
  function round(){
    if(r>=pool.length)return finish("build","Собери слово",score,pool.length);
    const w=pool[r],word=w.en.toLowerCase();
    let letters=shuffle(word.split(""));
    if(letters.join("")===word)letters.reverse();
    let slots=Array(word.length).fill(null),failed=false,locked=false;
    function draw(){
      view.innerHTML=`<button class="back" id="bk">← Игры</button>
      <div class="between"><span class="muted">Собери слово · ${r+1}/${pool.length}</span></div>
      <div class="bar"><div style="width:${r/pool.length*100}%"></div></div>
      <div class="card center"><div class="muted">Напишите это слово по-английски</div><div class="en2">${w.ru}</div><div class="muted">[${w.tr}]</div>
      <button class="icon" id="sp" style="margin-top:8px">🔊</button></div>
      <div class="slots" id="sl">${slots.map((s,k)=>`<button class="slot${s!==null?" f":""}" data-k="${k}">${s!==null?letters[s].toUpperCase():""}</button>`).join("")}</div>
      <div class="tiles">${letters.map((l,k)=>slots.includes(k)?`<button class="tile used" disabled>${l.toUpperCase()}</button>`:`<button class="tile" data-k="${k}">${l.toUpperCase()}</button>`).join("")}</div>`;
      $("#bk").onclick=Play;$("#sp").onclick=()=>say(w.en);
      view.querySelectorAll(".tile:not(.used)").forEach(t=>t.onclick=()=>{
        if(locked)return;const e=slots.indexOf(null);if(e<0)return;
        slots[e]=+t.dataset.k;SFX.pop();draw();
        if(!slots.includes(null))check();
      });
      view.querySelectorAll(".slot").forEach(s=>s.onclick=()=>{
        if(locked)return;if(slots[s.dataset.k]!==null){slots[s.dataset.k]=null;SFX.tap();draw()}
      });
    }
    function check(){
      locked=true;
      const built=slots.map(s=>letters[s]).join("");
      if(built===word){
        view.querySelectorAll(".slot").forEach(s=>s.classList.add("okk"));
        answer(true);say(w.en);if(!failed)score++;
        later(()=>{r++;round()},1100);
      }else{
        failed=true;answer(false);$("#sl").classList.add("shake");
        later(()=>{slots=Array(word.length).fill(null);locked=false;draw()},600);
      }
    }
    draw();
  }
  round();
}

/* ---- type the answer yourself ---- */
function typeGame(){
  const pool=shuffle(TOPICS.sent.words).slice(0,8);let r=0,score=0;
  const nz=t=>t.toLowerCase().replace(/[.?!,]/g,"").replace(/\s+/g," ").trim();
  function lev(a,b){const m=[];for(let i=0;i<=a.length;i++){m[i]=[i];for(let j=1;j<=b.length;j++)m[i][j]=i?0:j}for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return m[a.length][b.length]}
  function round(){
    if(r>=pool.length)return finish("type","Напиши сам",score,pool.length);
    const w=pool[r],c=nz(w[0]);let tries=0,hinted=false,locked=false;
    view.innerHTML=`<button class="back" id="bk">← Игры</button><div class="muted">Напиши сам · ${r+1}/${pool.length}</div><div class="bar"><div style="width:${r/pool.length*100}%"></div></div>

    <div class="note" id="fb">Регистр и знаки препинания не важны</div>

    <div class="row"><button class="btn ghost" id="sk">Не знаю</button></div>`;
    $("#bk").onclick=Play;
    const next=ms=>later(()=>{r++;round()},ms),ti=$("#ti");
    $("#hn").onclick=()=>{hinted=true;$("#hn2").textContent="Начало: "+w[0].split(" ").slice(0,2).join(" ")+" … (слов: "+w[0].split(" ").length+")";SFX.tap()};
    $("#sk").onclick=()=>{if(locked)return;locked=true;answer(false);$("#fb").innerHTML="Ответ: <b>"+w[0]+"</b>";say(w[0]);next(2400)};
    const check=()=>{
      if(locked)return;const u=nz(ti.value);if(!u)return;
      if(u===c||(c.length>10&&lev(u,c)<=1)){locked=true;answer(true);if(!tries&&!hinted)score++;$("#fb").innerHTML=(u===c?"✅ Верно!":"✅ Почти! Правильно так: <b>"+w[0]+"</b>");say(w[0]);next(1500)}
      else{tries++;answer(false);ti.classList.add("shake");setTimeout(()=>ti.classList.remove("shake"),400);
        if(tries>=2){locked=true;$("#fb").innerHTML="Ответ: <b>"+w[0]+"</b>";say(w[0]);next(2400)}else $("#fb").textContent="Не совсем. Попробуй ещё раз (подсказка поможет)"}
    };
    $("#ck").onclick=check;ti.onkeydown=e=>{if(e.key==="Enter")check()};
  }
  round();
}

/* ---- online translation with fallbacks (shared by "Моя песня" and "Спой на английском") ---- */
const TRC={};
async function tfetch(url,ms){
  const c=typeof AbortController!=="undefined"?new AbortController():null,tm=setTimeout(()=>{try{c&&c.abort()}catch(e){}},ms||9000);
  try{const r=await fetch(url,c?{signal:c.signal}:undefined);if(!r.ok)throw new Error("http "+r.status);return await r.json()}
  finally{clearTimeout(tm)}
}
const TR_PROVIDERS=[
  async(t,f,o)=>{const j=await tfetch("https://translate.googleapis.com/translate_a/single?client=gtx&dt=t&sl="+f+"&tl="+o+"&q="+encodeURIComponent(t));
    return((j&&j[0])||[]).map(s=>(s&&s[0])||"").join("")},
  async(t,f,o)=>{const j=await tfetch("https://api.mymemory.translated.net/get?q="+encodeURIComponent(t)+"&langpair="+f+"|"+o);
    const x=j&&j.responseData&&j.responseData.translatedText;
    if(!x||+j.responseStatus!==200||/MYMEMORY WARNING|INVALID|QUERY LENGTH|PLEASE SELECT/i.test(x))throw new Error("mm");
    const d=document.createElement("textarea");d.innerHTML=x;return d.value},
  async(t,f,o)=>{const j=await tfetch("https://lingva.ml/api/v1/"+f+"/"+o+"/"+encodeURIComponent(t));return(j&&j.translation)||""},
  /* works only where api.anthropic.com is reachable without a key (the claude.ai preview); fails fast elsewhere */
  async(t,f,o)=>{
    const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:300,messages:[{role:"user",content:"Translate this song lyric line from "+(f==="ru"?"Russian":"English")+" to "+(o==="en"?"English":"Russian")+". Reply with only the translation: no quotes, no comments.\n\n"+t}]})});
    if(!r.ok)throw new Error("api");const j=await r.json();return((j&&j.content)||[]).map(x=>x.text||"").join("").trim()}
];
async function trAuto(t,from,to){
  t=String(t).trim();if(!t)throw new Error("empty");
  const key=from+"|"+to+"|"+t;if(TRC[key])return TRC[key];
  const cyr=s=>(s.match(/[а-яё]/gi)||[]).length,lat=s=>(s.match(/[a-z]/gi)||[]).length;
  for(const p of TR_PROVIDERS){
    try{
      const x=String(await p(t,from,to)||"").trim();
      if(!x||x.toLowerCase()===t.toLowerCase())continue;
      if(to==="en"&&cyr(x)>lat(x))continue;
      if(to==="ru"&&lat(x)>cyr(x))continue;
      return TRC[key]=x;
    }catch(e){}
  }
  throw new Error("tr");
}

async function trLines(lines,from,to){
  const book=from==="ru"?PBm:PBr,out=lines.map(l=>book[nrm(l)]||null),need=out.map((x,i)=>x?-1:i).filter(i=>i>=0);

      const parts=String(x).split(/\n+/).map(t=>t.trim()).filter(Boolean);

        w(0,"RIFF");v.setUint32(4,36+n*ch*2,true);w(8,"WAVEfmt ");v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,ch,true);v.setUint32(24,sr,true);v.setUint32(28,sr*ch*2,true);v.setUint16(32,ch*2,true);v.setUint16(34,16,true);w(36,"data");v.setUint32(40,n*ch*2,true);
        const d=[];for(let c=0;c<ch;c++)d.push(out.getChannelData(c));let o=44;
        for(let i=0;i<n;i++)for(let c=0;c<ch;c++){const x=Math.max(-1,Math.min(1,d[c][i]));v.setInt16(o,x<0?x*32768:x*32767,true);o+=2}
        const url=URL.createObjectURL(new Blob([ab],{type:"audio/wav"})),a=document.createElement("a");
        a.href=url;a.download="my-english-cover-mix.wav";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);
        SFX.ok();
      }catch(e){console.error(e);toast("Не получилось собрать файл. Скачай «Только голос».")}
      b.disabled=false;b.textContent=old;
    };
  }
  setup();
}

/* ================= LESSONS ================= */
const wi=names=>names.map(en=>{const w=WORD[en],e=EX[en]||["",""];return{k:"w",en:w.en,tr:w.tr,ru:w.ru,ex:e[0],exRu:e[1]}});
const li=ix=>ix.map(i=>{const a=ALPHA[i];return{k:"l",ch:a[0],c:a[0].split(" ")[0],snd:a[1],say:a[2],word:a[3],wru:a[4]}});
const lessonItems=l=>l.type==="l"?li(l.items):wi(l.items);
let LS=null;
function Learn(){
  nav();redraw=null;
  const nIdx=LESSONS.findIndex(l=>!S.lessons[l.id]);
  let html=`<h2>Ваш курс</h2><div class="muted">Чтобы открыть следующий урок, наберите 70% и больше. Пройдено: ${Object.keys(S.lessons).length}/${LESSONS.length}</div>`,sec="";
  LESSONS.forEach((l,i)=>{
    if(l.sec!==sec){sec=l.sec;html+=`<h2>${sec}</h2>`}
    const d=S.lessons[l.id],lock=nIdx>=0&&i>nIdx;
    html+=`<button class="lesson${d?" done":""}${i===nIdx?" cur":""}${lock?" lock":""}" data-l="${i}"><div class="le">${lock?"🔒":l.e}</div><div class="lt"><b>${i+1}. ${l.t}</b><span>${l.d}</span></div><div class="ls">${d?"⭐".repeat(d.stars):(i===nIdx?"▶ Начать":"")}</div></button>`;
  });
  view.innerHTML=html;
  view.querySelectorAll(".lesson").forEach(b=>b.onclick=()=>{
    if(b.classList.contains("lock")){SFX.bad();toast("🔒 Сначала пройдите предыдущий урок");return}
    startLesson(+b.dataset.l);
  });
}
function startLesson(i){nav();LS={i,items:lessonItems(LESSONS[i]),t:0};SFX.pop();teachStep()}
function teachStep(){
  const l=LESSONS[LS.i],it=LS.items[LS.t],n=LS.items.length,w=it.k==="w";
  const main=w?it.en:it.say,exT=w?it.ex:it.word;
  const body=w?`<div class="en">${it.en}</div><div class="muted">[${it.tr}]</div><div class="en2" style="font-size:22px">${it.ru}</div>`+(it.ex?`<div class="ex"><div style="font-family:Georgia,serif;font-size:19px">${it.ex}</div><div class="muted">${it.exRu}</div><button class="icon" id="sx" style="margin-top:8px">🔊</button></div>`:"")
   :`<div class="big">${it.ch}</div><div class="muted">называется «${it.snd}»</div><div class="ex"><div class="muted">например, в слове</div><div class="en2">${it.word}</div><div class="muted">${it.wru}</div><button class="icon" id="sx" style="margin-top:8px">🔊</button></div>`;
  view.innerHTML=`<button class="back" id="bk">← Уроки</button>
  <div class="between"><span class="muted">${l.t} · Изучаем ${LS.t+1}/${n}</span></div>
  <div class="bar"><div style="width:${LS.t/n*100}%"></div></div>
  ${LS.t===0&&l.tip?`<div class="tip">💡 ${l.tip}</div>`:""}
  <div class="card center prompt">${body}
    <div class="row" style="justify-content:center"><button class="btn ghost" id="s1">🔊 Обычно</button><button class="btn ghost" id="s2">🐢 Медленно</button></div></div>
  ${voiceNote()}
  <div class="row">${LS.t>0?'<button class="btn ghost" id="pv">← Назад</button>':''}<button class="btn" id="nx">${LS.t<n-1?"Дальше →":"К практике 🎯"}</button></div>`;
  $("#bk").onclick=Learn;
  $("#s1").onclick=()=>say(main);$("#s2").onclick=()=>say(main,true);
  if($("#sx"))$("#sx").onclick=()=>say(exT);
  if($("#pv"))$("#pv").onclick=()=>{LS.t--;SFX.tap();teachStep()};
  $("#nx").onclick=()=>{SFX.pop();if(LS.t<n-1){LS.t++;teachStep()}else startPractice()};
  later(()=>say(main),350);
}
function startPractice(){
  const k=LS.items[0].k,types=k==="w"?(LESSONS[LS.i].sent?["ord","tr","rev"]:["tr","listen","rev"]):["snd","hear"];
  LS.types=types;
  LS.q=shuffle(LS.items).map((it,i)=>({it,type:types[i%types.length],first:true}));
  LS.n=LS.items.length;LS.right=0;LS.done=0;LS.combo=0;
  practiceStep();
}
function lessonQ(cur){
  const it=cur.it,t=cur.type,others=LS.items.filter(x=>x!==it);
  const pick3=(arr,ex)=>[...new Set(arr)].filter(x=>x!==ex).slice(0,3);
  const mk=(good,bad)=>shuffle([{t:good,ok:1},...bad.map(x=>({t:x}))]);
  if(t==="ord"){const base=it.en.replace(/[.?!]$/,""),pu=it.en.slice(base.length),ws=base.replace(/,/g,"").split(" ").map(x=>x==="I"?x:x.toLowerCase()),fm=a=>{const z=a.join(" ");return z[0].toUpperCase()+z.slice(1)+pu},good=fm(ws),bad=new Set();for(let n=0;n<40&&bad.size<3;n++){const c=fm(shuffle([...ws]));if(c!==good)bad.add(c)}
    return{prompt:`<div class="muted">Составь правильное предложение</div><div class="en2">${it.ru}</div>`,after:it.en,opts:mk(good,[...bad])}}
  if(t==="tr")return{prompt:`<div class="muted">Что это значит?</div><div class="en">${it.en}</div><div class="muted">[${it.tr}]</div>`,say:it.en,after:it.en,
    opts:mk(it.ru,pick3([...shuffle(others.map(x=>x.ru)),...shuffle(ALL.map(x=>x.ru))],it.ru))};
  if(t==="listen")return{prompt:`<div class="muted">Послушайте и выберите слово</div><div style="font-size:50px;margin:6px 0">🎧</div>`,say:it.en,auto:1,
    opts:mk(it.en,pick3([...shuffle(others.map(x=>x.en)),...shuffle(ALL.map(x=>x.en))],it.en))};
  if(t==="rev")return{prompt:`<div class="muted">Как сказать по-английски…</div><div class="en2">${it.ru}</div>`,after:it.en,
    opts:mk(it.en,pick3([...shuffle(others.map(x=>x.en)),...shuffle(ALL.map(x=>x.en))],it.en))};
  if(t==="snd")return{prompt:`<div class="muted">Как называется эта буква?</div><div class="en" style="font-size:68px">${it.ch}</div>`,say:it.say,
    opts:mk(it.snd,pick3([...shuffle(others.map(x=>x.snd)),...shuffle(ALPHA.map(a=>a[1]))],it.snd))};
  return{prompt:`<div class="muted">Какую букву вы слышите?</div><div style="font-size:50px;margin:6px 0">🎧</div>`,say:it.say,auto:1,
    opts:mk(it.ch,pick3([...shuffle(others.map(x=>x.ch)),...shuffle(ALPHA.map(a=>a[0]))],it.ch))};
}
function practiceStep(){
  if(!LS.q.length)return lessonEnd();
  const cur=LS.q.shift(),q=lessonQ(cur),l=LESSONS[LS.i];let locked=false;
  view.innerHTML=`<button class="back" id="bk">← Уроки</button>
  <div class="between"><span class="muted">${l.t} · Практика</span><span class="combo">${LS.combo>1?"🔥 x"+LS.combo:""}</span></div>
  <div class="bar"><div style="width:${LS.done/LS.n*100}%"></div></div>
  <div class="card center prompt">${q.prompt}${q.say?'<div class="row" style="justify-content:center"><button class="icon" id="sp">🔊</button><button class="icon" id="sl">🐢</button></div>':''}</div>
  <div>${q.opts.map((o,k)=>`<button class="opt" data-k="${k}">${o.t}</button>`).join("")}</div>`;
  $("#bk").onclick=Learn;
  if(q.say){$("#sp").onclick=()=>say(q.say);$("#sl").onclick=()=>say(q.say,true);if(q.auto)later(()=>say(q.say),350)}
  const btns=view.querySelectorAll(".opt");
  btns.forEach(b=>b.onclick=()=>{
    if(locked)return;locked=true;
    const o=q.opts[b.dataset.k];
    if(o.ok){
      b.classList.add("ok");LS.done++;if(cur.first)LS.right++;LS.combo++;answer(true);
      if(q.after)later(()=>say(q.after),250);
    }else{
      b.classList.add("bad");LS.combo=0;answer(false);
      btns.forEach((x,k)=>{if(q.opts[k].ok)x.classList.add("ok")});
      const ts=LS.types;
      LS.q.push({it:cur.it,type:ts[(ts.indexOf(cur.type)+1)%ts.length],first:false});
      if(q.after)later(()=>say(q.after),250);
    }
    later(practiceStep,1300);
  });
}
function lessonEnd(){
  const l=LESSONS[LS.i],n=LS.n,pct=LS.right/n,pass=pct>=.7;
  const stars=pct>=.95?3:pct>=.8?2:1;let first=false;
  if(pass){
    const old=S.lessons[l.id];first=!old;
    S.lessons[l.id]={stars:Math.max(stars,old?old.stars:0)};stat("lesson-done","Урок пройден");
    LS.items.forEach(it=>{if(it.k==="w"&&!S.known.includes(it.en))S.known.push(it.en)});
    gainXP(15+LS.right*3+(first?30:0));
    if(stars>=2){SFX.level();confetti()}else SFX.ok();
  }else SFX.bad();
  save();checkAch();hud();
  const hasNext=LS.i<LESSONS.length-1;
  view.innerHTML=`<div class="card center hero" style="padding:28px 16px"><div class="muted">${l.t}</div>
    <div class="stars">${pass?"⭐".repeat(stars)+"☆".repeat(3-stars):"💪"}</div>
    <div class="big">${LS.right}/${n}</div>
    <div class="muted" style="margin-top:6px">${pass?(first?"Урок пройден! Следующий урок открыт 🎉":"Урок засчитан ✔"):"Нужно набрать минимум 70%. Повторите материал и попробуйте снова."}</div>
    <div class="muted" style="margin-top:4px">Считаются правильные ответы с первой попытки</div></div>
    ${pass&&hasNext?'<div class="row"><button class="btn gold" id="nl">Следующий урок →</button></div>':''}
    <div class="row"><button class="btn ghost" id="rv">📖 Повторить</button><button class="btn" id="pa">🎯 Практика ещё раз</button></div>
    <div class="row"><button class="btn ghost" id="ls">Все уроки</button></div>`;
  if($("#nl"))$("#nl").onclick=()=>startLesson(LS.i+1);
  $("#rv").onclick=()=>{LS.t=0;teachStep()};
  $("#pa").onclick=startPractice;
  $("#ls").onclick=Learn;
}

/* ================= PROFILE ================= */
function Me(){
  const acc=S.stats.a?Math.round(S.stats.c/S.stats.a*100):0;
  view.innerHTML=`
  <div class="card hero center"><div class="muted">Уровень</div><div class="big">${level()}</div>
    <div class="bar"><div style="width:${S.xp%100}%"></div></div><div class="muted">Всего ${S.xp} XP</div></div>
  <div class="games">
    <div class="card center" style="margin:0"><div class="en2">🔥 ${S.streak}</div><div class="muted">дней подряд</div></div>
    <div class="card center" style="margin:0"><div class="en2">${acc}%</div><div class="muted">точность (${S.stats.c}/${S.stats.a})</div></div>
    <div class="card center" style="margin:0"><div class="en2">${S.known.length}</div><div class="muted">слов выучено</div></div>
    <div class="card center" style="margin:0"><div class="en2">${S.fav.length}</div><div class="muted">в избранном</div></div>
  </div>
  <h2>Достижения</h2>
  <div class="ach">${ACH.map(a=>`<div class="a${S.ach.includes(a[0])?" on":""}"><div class="e">${a[1]}</div><b style="display:block;margin-top:4px">${a[2]}</b>${a[3]}</div>`).join("")}</div>
  <h2>Настройки</h2>
  <div class="card">
    <div class="set"><span>🎵 Фоновая музыка</span><button class="sw${S.set.music?" on":""}" id="swM"></button></div>
    <div class="set"><span>Громкость музыки</span><input type="range" min="0" max="100" value="${S.set.mv*100}" id="vM"></div>
    <div class="set"><span>🔔 Звуковые эффекты</span><button class="sw${S.set.sfx?" on":""}" id="swS"></button></div>
    <div class="set"><span>Громкость эффектов</span><input type="range" min="0" max="100" value="${S.set.sv*100}" id="vS"></div>
    <div class="set"><span>🗣 Скорость голоса</span><input type="range" min="50" max="110" value="${(S.set.rate||.9)*100}" id="vR"></div>
    <div class="set"><span>🧪 Проверка звука</span><button class="btn" id="tst" style="padding:9px 16px">Тест</button></div>
    <div class="note" id="diag"></div>
    <div class="set"><span>🎨 Тема</span><div class="themes">
      <button class="th${S.theme==="royal"?" on":""}" data-th="royal" style="background:linear-gradient(135deg,#d8bf8a,#b08d4c)"></button>
      <button class="th${S.theme==="emerald"?" on":""}" data-th="emerald" style="background:linear-gradient(135deg,#b9d6c8,#6f9c87)"></button>
      <button class="th${S.theme==="rose"?" on":""}" data-th="rose" style="background:linear-gradient(135deg,#ecc9c9,#b98585)"></button></div></div>
  </div>
  <div class="row"><button class="btn ghost" id="rst">Сбросить прогресс</button></div>`;
  $("#swM").onclick=()=>{setMusic(!S.set.music);$("#swM").classList.toggle("on",S.set.music)};
  $("#swS").onclick=()=>{S.set.sfx=!S.set.sfx;save();applyVol();$("#swS").classList.toggle("on",S.set.sfx);SFX.pop()};
  $("#vM").oninput=e=>{S.set.mv=e.target.value/100;save();applyVol()};
  $("#vS").oninput=e=>{S.set.sv=e.target.value/100;save();applyVol()};
  $("#vS").onchange=()=>SFX.ok();
  $("#tst").onclick=soundTest;
  $("#vR").oninput=e=>{S.set.rate=e.target.value/100;save()};
  $("#vR").onchange=()=>say("Hello, how are you?");
  view.querySelectorAll(".th").forEach(b=>b.onclick=()=>{S.theme=b.dataset.th;document.documentElement.dataset.theme=S.theme;save();SFX.pop();Me()});
  $("#rst").onclick=()=>{if(confirm("Сбросить весь прогресс?")){Object.assign(S,{known:[],bests:{},lessons:{},xp:0,streak:0,lastDay:"",today:{d:todayStr(),n:0},stats:{a:0,c:0},ach:[],seen:[],fav:[],mseen:[],mine:[],flags:{}});save();hud();Me()}};
}

hud();render();
new MutationObserver(()=>{view.classList.remove("pgin");void view.offsetWidth;view.classList.add("pgin")}).observe(view,{childList:true});
{let n=0,t0=0;document.querySelector(".logo").addEventListener("click",()=>{const now=Date.now();n=now-t0>3000?1:n+1;t0=now;if(n>=7){n=0;tab="admin";redraw=null;SFX.pop();render()}})}
</script>
