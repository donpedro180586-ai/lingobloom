<!DOCTYPE html>
<html lang="ru" data-theme="royal">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Learn English</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Anton&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0b0d;--surface:#131316;--text:#f3efe7;--muted:#8d8a84;--line:rgba(243,239,231,.09);--line2:rgba(243,239,231,.18);--glass:#131316;--ok:#7fb89a;--bad:#c97a7a;--a:#c8a96a;--a2:#b08d4c;--g:#d8bf8a;--gt:rgba(200,169,106,.1);--serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;--sans:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
[data-theme=emerald]{--a:#8fb8a4;--a2:#6f9c87;--g:#b9d6c8;--gt:rgba(143,184,164,.1)}
[data-theme=rose]{--a:#d4a5a5;--a2:#b98585;--g:#ecc9c9;--gt:rgba(212,165,165,.1)}
[data-theme=platinum]{--a:#a9b8d0;--a2:#7f92b3;--g:#d3deef;--gt:rgba(169,184,208,.1)}
[data-theme=amethyst]{--a:#b79ae6;--a2:#8f6fcf;--g:#d9c8f5;--gt:rgba(183,154,230,.1)}
[data-theme=ruby]{--a:#e07a8a;--a2:#c14a5e;--g:#f4b9c3;--gt:rgba(224,122,138,.1)}
[data-theme=midnight]{--a:#6ea8ff;--a2:#4a7fd6;--g:#a9ccff;--gt:rgba(110,168,255,.1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.45;padding:0 0 110px;min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
.bg{position:fixed;inset:0;z-index:-1;background:radial-gradient(900px 500px at 50% -15%,var(--gt),transparent 70%),var(--bg)}
.bg i{display:none}
#cf{position:fixed;inset:0;pointer-events:none;z-index:50}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(14px + env(safe-area-inset-top)) 20px 12px;background:linear-gradient(var(--bg) 70%,transparent)}
.logo{font-family:var(--serif);font-size:19px;font-weight:600;letter-spacing:.28em;text-transform:uppercase;color:var(--g)}
.hud{display:flex;gap:6px;align-items:center}
.pill{border:1px solid var(--line);border-radius:20px;padding:6px 12px;font-size:12px;font-weight:500;letter-spacing:.03em;white-space:nowrap;color:var(--muted)}
.pill.gold{color:var(--g);border-color:rgba(200,169,106,.3)}
.mbtn{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--text);font-size:14px;cursor:pointer;padding:0}
main{padding:6px 20px;max-width:560px;margin:0 auto;animation:in .4s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
h2{font-family:var(--serif);font-size:26px;font-weight:600;letter-spacing:.01em;margin:28px 0 10px}
.muted{color:var(--muted);font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;margin:14px 0}
.hero{background:linear-gradient(160deg,var(--gt),transparent 65%),var(--surface);border-color:rgba(200,169,106,.28)}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.center{text-align:center}
.en{font-family:var(--serif);font-size:48px;font-weight:600;line-height:1.1;margin:10px 0;color:var(--text);overflow-wrap:anywhere}
.en2{font-family:var(--serif);font-size:30px;font-weight:600;margin:6px 0;overflow-wrap:anywhere}
.btn{border:0;background:linear-gradient(180deg,var(--g),var(--a2));color:#17130a;padding:14px 20px;border-radius:12px;font-family:var(--sans);font-size:14px;font-weight:600;letter-spacing:.04em;cursor:pointer;transition:transform .12s,opacity .2s}
.btn:hover{opacity:.92}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;border:1px solid var(--line2);color:var(--text)}
.btn.ok{background:var(--ok);color:#0c1a13}
.btn.bad{background:var(--bad);color:#210d0d}
.btn.gold{background:linear-gradient(180deg,var(--g),var(--a2));color:#17130a}
.row{display:flex;gap:10px;margin-top:14px}.row .btn{flex:1}
.icon{border:1px solid var(--line2);background:transparent;color:var(--text);width:44px;height:44px;border-radius:50%;font-size:17px;cursor:pointer}
.back{border:0;background:none;color:var(--muted);font-size:13px;letter-spacing:.04em;cursor:pointer;padding:6px 0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:transparent;color:var(--muted);padding:8px 16px;border-radius:20px;font-size:13px;font-weight:500;cursor:pointer;transition:.2s}
.chip.on{border-color:var(--a);background:var(--gt);color:var(--g)}
.search{width:100%;padding:13px 16px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--text);font-size:15px;outline:none;margin:6px 0;transition:border-color .2s}
.search:focus{border-color:var(--a)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
.letter{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 0 10px;text-align:center;font-family:var(--serif);font-size:30px;font-weight:600;cursor:pointer;transition:transform .12s,border-color .2s}
.letter small{display:block;font-family:var(--sans);font-size:11px;font-weight:400;color:var(--muted);margin-top:2px}
.letter:active{transform:scale(.95)}
.letter.seen{border-color:rgba(200,169,106,.45);color:var(--g)}
.word{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px}
.word b{font-family:var(--serif);font-size:22px;font-weight:600}
.word .acts{display:flex;gap:6px}
.star{color:var(--muted)}.star.on{color:var(--g)}
.bar{height:4px;background:var(--line);border-radius:4px;overflow:hidden;margin:10px 0}
.bar div{height:100%;background:linear-gradient(90deg,var(--a2),var(--g));border-radius:4px;transition:width .5s}
.ring{--p:0;width:92px;height:92px;border-radius:50%;background:conic-gradient(var(--g) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;flex:none}
.ring>div{width:82px;height:82px;border-radius:50%;background:var(--surface);display:grid;place-items:center;text-align:center;font-family:var(--serif);font-weight:600;font-size:22px;line-height:1.1}
.ring small{display:block;font-family:var(--sans);font-size:10px;font-weight:400;color:var(--muted)}
.games{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.game{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;cursor:pointer;text-align:left;color:var(--text);transition:transform .15s,border-color .2s}
.game:active{transform:scale(.97)}
.game:hover{border-color:rgba(200,169,106,.5)}
.game .e{font-size:26px}.game b{display:block;margin:10px 0 2px;font-family:var(--serif);font-size:19px;font-weight:600}
.game span{font-size:12px;color:var(--muted)}
.opt{display:block;width:100%;text-align:left;margin:9px 0;padding:16px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--text);font-size:16px;cursor:pointer;transition:transform .12s,border-color .2s,background .2s}
.opt:hover{border-color:var(--line2)}
.opt:active{transform:scale(.99)}
.opt.ok{background:rgba(127,184,154,.14);border-color:var(--ok);animation:pop .4s}
.opt.bad{background:rgba(201,122,122,.14);border-color:var(--bad);animation:shake .4s}
@keyframes pop{50%{transform:scale(1.02)}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.shake{animation:shake .4s}
.prompt{padding:26px 18px}
.combo{color:var(--g);font-weight:600;font-size:13px;letter-spacing:.06em}
.fc{perspective:900px;height:240px;margin:16px 0;cursor:pointer}
.fc .in{position:relative;height:100%;transition:transform .6s cubic-bezier(.3,1.1,.4,1);transform-style:preserve-3d}
.fc.f .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:20px;border:1px solid rgba(200,169,106,.3);background:linear-gradient(160deg,var(--gt),transparent 70%),var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:18px}
.face.back{transform:rotateY(180deg);background:linear-gradient(160deg,rgba(200,169,106,.16),transparent 70%),var(--surface)}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.m{padding:16px 8px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--text);font-size:15px;cursor:pointer;min-height:56px;transition:all .2s}
.m.sel{border-color:var(--a);background:var(--gt)}
.m.done{opacity:.4;background:rgba(127,184,154,.14);border-color:var(--ok);pointer-events:none}
.m.bad{background:rgba(201,122,122,.16);border-color:var(--bad);animation:shake .4s}
.slots,.tiles{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:16px 0}
.slot,.tile{width:44px;height:54px;border-radius:12px;font-family:var(--serif);font-size:26px;font-weight:600;color:var(--text);cursor:pointer}
.slot{border:1px dashed var(--line2);background:transparent}
.slot.f{border:1px solid var(--a);background:var(--gt)}
.slot.okk{border-color:var(--ok);background:rgba(127,184,154,.16)}
.tile{border:1px solid var(--line);background:var(--surface)}
.tile.used{opacity:.15}
.big{font-family:var(--serif);font-size:60px;font-weight:600}
.stars{font-size:30px;letter-spacing:6px;margin:6px 0;color:var(--g)}
.ach{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.a{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 6px;text-align:center;font-size:11px;color:var(--muted)}
.a .e{font-size:26px;filter:grayscale(1);opacity:.3}
.a.on{border-color:rgba(200,169,106,.45);color:var(--text)}
.a.on .e{filter:none;opacity:1}
.set{display:flex;justify-content:space-between;align-items:center;padding:14px 0;gap:12px;border-bottom:1px solid var(--line)}
.set:last-child{border-bottom:0}
.set input[type=range]{width:50%;accent-color:var(--a)}
.sw{position:relative;width:46px;height:26px;border-radius:16px;background:var(--line2);border:0;cursor:pointer;flex:none;transition:.25s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--text);transition:.25s}
.sw.on{background:var(--a)}.sw.on::after{left:23px;background:#17130a}
.themes{display:flex;gap:12px}
.th{width:30px;height:30px;border-radius:50%;border:0;cursor:pointer;transition:box-shadow .2s}
.th.on{box-shadow:0 0 0 2px var(--bg),0 0 0 3px var(--g)}
#toast{position:fixed;top:calc(66px + env(safe-area-inset-top));left:50%;transform:translate(-50%,-30px);opacity:0;z-index:60;background:var(--surface);border:1px solid rgba(200,169,106,.4);border-radius:14px;padding:12px 20px;font-size:13px;font-weight:500;letter-spacing:.02em;transition:.35s;pointer-events:none;max-width:90%;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.6)}
#toast.show{opacity:1;transform:translate(-50%,0)}
nav{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:30;display:flex;gap:2px;padding:6px;background:rgba(14,14,16,.88);border:1px solid var(--line);border-radius:22px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 12px 40px rgba(0,0,0,.6);width:calc(100% - 28px);max-width:440px}
nav button{flex:1;border:0;background:none;color:var(--muted);padding:9px 1px 8px;font-family:var(--sans);font-size:10px;letter-spacing:.05em;cursor:pointer;border-radius:16px;transition:.25s}
nav button .ic{display:grid;place-items:center;height:22px;margin-bottom:3px;font-family:var(--serif);font-size:19px;font-weight:600;line-height:1}
nav button svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--g);background:var(--gt)}
.lesson{display:flex;align-items:center;gap:14px;width:100%;text-align:left;margin:10px 0;padding:14px;border-radius:16px;border:1px solid var(--line);background:var(--surface);color:var(--text);cursor:pointer;transition:transform .12s,border-color .2s}
.lesson:active{transform:scale(.99)}
.lesson .le{font-size:22px;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line2);flex:none;font-family:var(--serif);font-weight:600}
.lesson .lt{flex:1}.lesson .lt b{display:block;font-size:15px;font-weight:600}.lesson .lt span{font-size:12px;color:var(--muted)}
.lesson .ls{font-size:13px;color:var(--g)}
.lesson.cur{border-color:rgba(200,169,106,.55);box-shadow:0 0 28px var(--gt)}
.lesson.done .le{border-color:var(--ok);color:var(--ok)}
.lesson.lock{opacity:.45}
.ex{margin-top:14px;padding:14px;border-radius:14px;background:rgba(255,255,255,.03);border:1px dashed var(--line2)}
.tip{background:var(--gt);border-left:2px solid var(--a);border-radius:4px 14px 14px 4px;padding:12px 16px;font-size:14px;margin:12px 0;line-height:1.5}
.note{font-size:12px;color:var(--muted);text-align:center;margin:8px 0;line-height:1.5}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
main.pgin>*{animation:rise .55s cubic-bezier(.2,.8,.2,1) backwards}
main.pgin>*:nth-child(2){animation-delay:.05s}main.pgin>*:nth-child(3){animation-delay:.1s}main.pgin>*:nth-child(4){animation-delay:.15s}main.pgin>*:nth-child(5){animation-delay:.2s}main.pgin>*:nth-child(6){animation-delay:.25s}main.pgin>*:nth-child(n+7){animation-delay:.3s}
@media(prefers-reduced-motion:reduce){main.pgin>*{animation:none}}
main.pgin h2::after{content:"";display:block;height:1px;width:0;background:var(--a);margin-top:8px;animation:ln .8s .2s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes ln{to{width:48px}}
.msvg{display:block;width:100%;height:auto;border-radius:14px}
.mrow{display:flex;gap:10px;overflow-x:auto;padding:4px 0 2px;scrollbar-width:none}.mrow::-webkit-scrollbar{display:none}
.mth{flex:none;width:96px;border-radius:12px;overflow:hidden;border:1px solid var(--line);cursor:pointer;transition:transform .12s}.mth:active{transform:scale(.95)}
.mm{position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:70;display:none;align-items:center;justify-content:center;padding:16px}.mm.on{display:flex}
.mmbox{background:var(--surface);border:1px solid var(--line2);border-radius:20px;max-width:400px;width:100%;max-height:92vh;overflow:auto;padding:14px}
.tile.w{width:auto;min-width:44px;height:44px;padding:0 12px;font-family:var(--sans);font-size:16px}
.wl{min-height:56px;align-items:center;border-bottom:1px dashed var(--line2)}
.mbtn{position:relative}
#hDot{position:absolute;top:-2px;right:-2px;width:10px;height:10px;border-radius:50%;background:var(--bad);border:2px solid var(--bg);display:none}
#hMeme{border-color:rgba(200,169,106,.4)}
.fl{animation:fl 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes fl{50%{transform:translateY(-6px) rotate(3deg)}}
@media(prefers-reduced-motion:reduce){.fl{animation:none}}
.mban{margin:4px 0 14px;border-radius:18px;overflow:hidden;border:1px solid rgba(200,169,106,.35);cursor:pointer;box-shadow:0 10px 30px rgba(0,0,0,.45);transition:transform .12s}.mban:active{transform:scale(.985)}.mban svg{display:block;width:100%;height:auto}
.pl{animation:pl 2.6s ease-out infinite;transform-box:fill-box;transform-origin:center}.pl2{animation-delay:.9s}.pl3{animation-delay:1.8s}
@keyframes pl{0%{opacity:.9;transform:scale(.7)}100%{opacity:0;transform:scale(1.3)}}
.fy{animation:fy 3s ease-in-out infinite}@keyframes fy{50%{transform:translateY(-10px)}}
.sp{animation:sp 40s linear infinite;transform-box:fill-box;transform-origin:center}@keyframes sp{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.pl,.fy,.sp{animation:none}}
.fk{animation:fk .9s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes fk{to{transform:scaleY(1.28) scaleX(.9)}}
.dr{animation:dr 2s ease-in infinite}@keyframes dr{0%{opacity:0}20%{opacity:1}100%{opacity:0;margin-top:34px}}
@media(prefers-reduced-motion:reduce){.fk,.dr{animation:none}}

/* --- "Спой на английском": look of the promo video --- */
.sg-file{display:block;text-align:center;cursor:pointer;padding:22px 16px;border:1px solid var(--line);border-radius:18px;background:var(--surface);margin:14px 0;font-size:18px;overflow-wrap:anywhere}
.sg-file.ok{color:var(--ok);font-weight:500;border-color:rgba(127,184,154,.35)}
.sg-file small{display:block;color:var(--muted);font-size:11px;margin-top:5px;font-weight:400}
.sg-h{font-family:var(--serif);font-size:23px;font-weight:600;display:block}
.wv{display:flex;align-items:flex-end;gap:3px;height:104px;margin:16px 0 8px;padding-top:12px;position:relative;touch-action:none;cursor:pointer;user-select:none;-webkit-user-select:none;outline:none}
.wv i{flex:1;min-width:2px;background:#4a4843;border-radius:2px;transition:background .15s}
.wv i.on{background:var(--g)}
.wv .mk{position:absolute;top:0;height:3px;background:var(--g);border-radius:2px;pointer-events:none}
.wv:focus-visible{box-shadow:0 0 0 2px var(--a)}
.pbtns{display:flex;gap:10px;margin-top:14px}
.pbtns .btn{flex:1;padding:13px 8px}
.lcard{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 16px 12px;margin:14px 0}
.lru{font-size:13px;color:var(--muted);margin-bottom:10px}
.lin{display:block;width:100%;background:transparent;border:0;border-bottom:1px solid transparent;outline:0;color:var(--text);font-family:var(--sans);font-size:17px;padding:0 34px 22px 0;margin:0;border-radius:0}
.lin:focus{border-bottom-color:var(--a)}
.spk{position:absolute;right:12px;bottom:10px;background:none;border:0;font-size:18px;cursor:pointer;padding:4px;opacity:.85}
.lyr .ln{text-align:center;margin:14px 0;opacity:.8;transition:opacity .25s}
.lyr .ln .le{font-size:17px;line-height:1.3;transition:font-size .25s,color .25s}
.lyr .ln .lr{font-size:12px;color:var(--muted);margin-top:2px}
.lyr.live .ln{opacity:.4}
.lyr .ln.cur{opacity:1}
.lyr .ln.cur .le{color:var(--g);font-size:23px;font-weight:600}
.rrow{display:flex;align-items:center;gap:8px;margin:18px 4px 8px;font-size:17px}
.rdot{width:11px;height:11px;border-radius:50%;background:#55524c;display:inline-block}
.rdot.on{background:var(--bad);animation:rblink 1s infinite}
@keyframes rblink{50%{opacity:.35}}
.mv{display:flex;align-items:flex-end;gap:4px;height:88px;margin:6px 4px 10px}
.mv i{flex:1;border-radius:2px;background:linear-gradient(180deg,var(--g),var(--a2));height:6%;transition:height .09s linear}
.adv{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.adv summary{cursor:pointer;color:var(--muted);font-size:13px;list-style:none;padding:4px 0}
.adv summary::-webkit-details-marker{display:none}
.adv summary::before{content:"＋ ";color:var(--g)}
.adv[open] summary::before{content:"－ "}
.phead{min-height:124px;display:flex;align-items:center;gap:16px;padding:22px 18px;border-radius:20px;border:1px solid var(--line);margin:14px 0;overflow:hidden}
.pinfo{min-width:0;flex:1}
.pname{font-family:var(--serif);font-size:28px;font-weight:600;line-height:1.1;color:#fff;overflow-wrap:anywhere;text-shadow:0 2px 12px rgba(0,0,0,.45)}
.pchips{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.pchips .pill{background:rgba(0,0,0,.38);color:#fff;border-color:rgba(255,255,255,.22)}
.av{position:relative;flex:none;border-radius:50%;display:grid;place-items:center}
.av::before{content:"";position:absolute;inset:0;border-radius:50%;background:var(--line2)}

sh out","lock in","mid","slop","touch grass"],"tip":"Забыл домашку? I'm cooked. Пора браться за ум? Lock in. Слишком долго сидишь в телефоне? Тебе скажут: touch grass."},{"id":"w5","sec":"Слова","e":"🍞","t":"Еда и напитки","d":"В кафе","type":"w","items":["bread","water","milk","tea","coffee","apple","meat","soup"],"tip":"В английском важно ударение: COF-fee, AP-ple. Ударный слог произносится громче и чуть длиннее."},{"id":"w6","sec":"Слова","e":"🧳","t":"Путешествие","d":"В дороге","type":"w","items":["Where?","station","airport","ticket","hotel","street","How much?","Help!"],"tip":"Полезная конструкция: Where is …? значит «Где …?». Попробуйте: Where is the station?"},{"id":"w7","sec":"Слова","e":"🐶","t":"Животные","d":"dog, cat, bird…","type":"w","items":["dog","cat","bird","fish","horse","cow","rabbit","bear","wolf","tiger"],"tip":"Животные в английском: a dog, a cat. Перед словом в единственном числе обычно стоит a: a dog, a bird."},{"id":"w8","sec":"Слова","e":"🎨","t":"Цвета","d":"red, blue, green…","type":"w","items":["red","blue","green","yellow","black","white","pink","purple"],"tip":"Цвет ставится перед предметом: a red apple, a blue pen. В русском наоборот, поэтому тренируйтесь."},{"id":"w9","sec":"Слова","e":"🏫","t":"Школа","d":"book, teacher, homework…","type":"w","items":["book","pen","teacher","student","school","homework","test","lesson","phone","game"],"tip":"Слова для школы пригодятся каждый день. Homework — это не множественное число: говорим my homework."},{"id":"w10","sec":"Слова","e":"🏃","t":"Глаголы","d":"go, eat, play…","type":"w","items":["go","eat","drink","play","read","write","sleep","run","watch","like"],"tip":"Глагол — главное слово действия: I eat, I play, I sleep. С he/she/it добавляем -s: she plays."},{"id":"w11","sec":"Слова","e":"⏰","t":"Время","d":"today, tomorrow, night…","type":"w","items":["today","tomorrow","yesterday","morning","evening","night","week","day"],"tip":"Слова времени ставят в начало или конец: Today I play. I play today."},{"id":"w12","sec":"Слова","e":"🏠","t":"Дом","d":"house, room, bed…","type":"w","items":["house","room","door","window","bed","table","chair","kitchen"],"tip":"My house, my room, my bed. Притяжательное my значит «мой, моя, моё»."},{"id":"s1","sec":"Предложения","e":"🧱","t":"Я есть…","d":"I am, you are, he is","type":"w","sent":1,"items":["I am a student.","You are my friend.","He is a doctor.","She is very happy.","We are at home.","They are my family."],"tip":"Простое предложение: кто + am/is/are + кто или какой. I → am, he/she/it → is, you/we/they → are. В английском глагол нельзя пропускать."},{"id":"s2","sec":"Предложения","e":"🔧","t":"Что я делаю","d":"Порядок слов","type":"w","sent":1,"items":["I like coffee.","She likes tea.","I want some water.","He drinks milk.","They have a cat.","I live in a big city."],"tip":"Порядок слов почти всегда такой: кто → что делает → что или где. К he/she/it в настоящем времени добавляется -s: she likes."},{"id":"s3","sec":"Предложения","e":"❓","t":"Вопросы и «не»","d":"Do you…? I do not…","type":"w","sent":1,"items":["Do you like pizza?","Where is my phone?","I do not know.","What is your name?","Can you help me?","I do not like tea."],"tip":"В вопросе вперёд выходит помощник: Do you like…? Can you…? Для «не» ставим not после помощника: I do not know."},{"id":"s5","sec":"Предложения","e":"⏪","t":"Прошлое","d":"was, went, did not","type":"w","sent":1,"items":["I was at home.","She went to school.","We ate pizza yesterday.","He watched a movie.","I did not sleep well.","They played games all night."],"tip":"Прошлое: I was / we were. У многих глаголов добавляется -ed (watched), а некоторые особые: go → went, eat → ate. Для «не» ставим did not + глагол в обычной форме."},{"id":"s6","sec":"Предложения","e":"🚀","t":"Планы и желания","d":"will, want to, can","type":"w","sent":1,"items":["I want to learn English.","I will call you tomorrow.","We are going to travel.","She can speak English.","I must go now.","Let us start the game."],"tip":"Будущее: will + глагол. Желание и план: want to / going to + глагол. После can, must и will глагол идёт без to: I can go."},{"id":"s8","sec":"Предложения","e":"🎬","t":"Что происходит сейчас","d":"am/is/are + -ing","type":"w","items":["I am reading a book.","She is playing a game.","We are watching a movie.","He is running in the park.","What are you doing?","They are eating lunch."],"tip":"Действие прямо сейчас: am/is/are + глагол с -ing. I am reading, she is playing.","sent":1},{"id":"m3","sec":"Мемы 🔥","e":"🧠","t":"Сленг: интернет","d":"skibidi, 6-7, brainrot…","type":"w","items":["skibidi","6-7","brainrot","yapping","NPC","Chat, is this real?"],"tip":"Skibidi и 6-7 не имеют точного смысла: смешно именно поэтому. Brainrot — шуточное название эпохи бесконечных мемов, а «Chat, is this real?» любят стримеры."},{"id":"s4","sec":"Мемы 🔥","e":"🤡","t":"Собери мем","d":"Предложения в мемном стиле","type":"w","sent":1,"items":["Bro is cooked.","This pizza is mid.","You need to touch grass.","I need to lock in.","He has so much rizz.","My brain is rotting."],"tip":"Тот же порядок слов, только фразы из интернета. Если справишься, уже можешь комментировать мемы по-английски."},{"id":"s7","sec":"Мемы 🔥","e":"🎬","t":"Стрим-сленг","d":"Чат, клипы, стримы","type":"w","sent":1,"items":["Chat is going crazy.","That clip went viral.","Drop the link in chat.","The stream just started.","I watch streams every night.","Please like and subscribe."],"tip":"Фразы, которые пригодятся в мире стримов и клипов. Порядок слов тот же: кто → что делает → что или где."},{"id":"m4","sec":"Мемы 🔥","e":"🌾","t":"Сленг 2026","d":"aura farming, ragebait, slay…","type":"w","items":["aura farming","vibe coding","ragebait","doomscrolling","low-key","slay"],"tip":"Слова из лент 2025–2026: aura farming — «качать ауру», vibe coding — программировать вместе с ИИ, ragebait — наживка для гнева, doomscrolling — бесконечная лента."},{"id":"m5","sec":"Мемы 🔥","e":"🏆","t":"Победа и вайб","d":"big W, glow up, side quest…","type":"w","items":["big W","glow up","side quest","rent free","main character"],"tip":"W — от win (победа), L — от loss (поражение). Big W значит «вот это победа!». Главный герой — main character."},{"id":"s9","sec":"Мемы 🔥","e":"🤳","t":"Собери мем 2","d":"Фразы из мемов","type":"w","items":["That was a huge win.","Her glow up is crazy.","He lives in my head rent free.","Stop doomscrolling and sleep.","I am vibe coding a game.","This is just ragebait."],"tip":"Мемные фразы строятся как обычные: кто → что делает → что. Собери их по порядку слов.","sent":1},{"id":"s10","sec":"Мемы 🔥","e":"🎤","t":"Собери мем 3","d":"Ещё мемные фразы","type":"w","items":["She slayed that speech.","Let us do a side quest.","He is aura farming.","This game is low-key hard.","I am the main character today.","Chat, drop a link here."],"tip":"Последний мемный набор: теперь ты можешь комментировать мемы по-английски.","sent":1},{"id":"w13","sec":"Ещё слова","e":"🧍","t":"Тело","d":"head, hand, eye…","type":"w","items":["head","hand","leg","eye","ear","mouth","nose","face"],"tip":"Части тела с my: my head, my hand. Слово eye («глаз») читается «ай», как буква I, а ear — «иэр»."},{"id":"w14","sec":"Ещё слова","e":"👕","t":"Одежда","d":"shirt, hat, coat…","type":"w","items":["shirt","pants","shoes","hat","coat","dress","socks","jacket"],"tip":"Pants, shoes и socks всегда во множественном числе, ведь это пары. Говорим: my shoes are new."},{"id":"w15","sec":"Ещё слова","e":"✨","t":"Какой?","d":"big, small, hot…","type":"w","items":["big","small","hot","cold","new","old","good","bad"],"tip":"Прилагательное стоит перед словом: a big house. А после is/are оно стоит отдельно: The house is big."},{"id":"w16","sec":"Ещё слова","e":"🏙️","t":"Места","d":"park, shop, bank…","type":"w","items":["park","shop","bank","cinema","library","hospital","city","village"],"tip":"Место обычно идёт с in или to: I live in a city, I go to the shop."},{"id":"w17","sec":"Ещё слова","e":"☀️","t":"Погода","d":"sun, rain, snow…","type":"w","items":["sun","rain","snow","wind","cloud","sky","warm","storm"],"tip":"О погоде говорят с it: It is warm. It is cold. А слова sun, rain, snow — это сама погода."},{"id":"s11","sec":"Ещё предложения","e":"🌅","t":"Мой день","d":"at seven, at noon…","type":"w","items":["I wake up at seven.","I brush my teeth.","I eat breakfast at home.","She goes to work by bus.","We have lunch at noon.","He goes to bed at ten."],"tip":"Время начинается с at: at seven, at ten. С he/she/it добавляем -s или -es: she goes, he eats.","sent":1},{"id":"s12","sec":"Ещё предложения","e":"👨‍👩‍👧","t":"Моя семья","d":"has, have, love","type":"w","items":["My mother is kind.","My father works a lot.","I have a big family.","She has two brothers.","He has a little sister.","We love our grandmother."],"tip":"I/you/we/they have, а he/she/it has: I have a family, she has two brothers.","sent":1},{"id":"s13","sec":"Ещё предложения","e":"☕","t":"В кафе","d":"I would like…","type":"w","items":["I would like some tea.","Can I have the menu?","The soup is very hot.","How much is the coffee?","The bill, please.","I do not eat meat."],"tip":"Вежливая просьба: I would like… («я бы хотел…»). Спросить можно так: Can I have…? Про цену: How much is…?","sent":1},{"id":"s14","sec":"Ещё предложения","e":"🧭","t":"Где это?","d":"left, right, straight","type":"w","items":["Where is the bank?","Turn left here.","Go straight ahead.","The park is near.","I live far from school.","The shop is open."],"tip":"Для дороги нужны команды: Turn left (налево), Turn right (направо), Go straight (прямо).","sent":1},{"id":"s15","sec":"Ещё предложения","e":"🌧️","t":"Погода и чувства","d":"It is…, I am…","type":"w","items":["It is cold today.","It is raining now.","The sun is bright.","I am very tired.","She is not sad.","We are hungry."],"tip":"Погода: It is cold. Чувства: I am tired. Глагол is/am/are нельзя пропускать.","sent":1},{"id":"s16","sec":"Ещё предложения","e":"🎸","t":"Хобби","d":"I love, I like to…","type":"w","items":["I love music.","He plays football every day.","She draws very well.","We like to swim.","They watch cartoons.","I read books at night."],"tip":"Ты любишь делать что-то? Ставь like to / love to + глагол: We like to swim. С he/she/it добавляется -s: he plays.","sent":1},{"id":"s17","sec":"Ещё предложения","e":"❓","t":"Вопросы: what, who, why","d":"what, who, why, when","type":"w","items":["What time is it?","Who is your friend?","Why are you sad?","When is the lesson?","Where do you live?","How old are you?"],"tip":"Вопросительное слово ставится в начало: What, Who, Why, When, Where, How. После него идёт is/are или do: Where do you live?","sent":1},{"id":"s18","sec":"Ещё мемы 🔥","e":"🤪","t":"Собери мем 4","d":"mid, cooked, delulu…","type":"w","items":["That was so mid.","No cap, this song is goated.","My aura is gone.","She is so delulu.","Stop yapping, bro.","I am so cooked."],"tip":"Ещё мемные фразы с порядком слов, как в обычном английском. Собери их, и можно писать комментарии по-английски.","sent":1},{"id":"n_family_1","sec":"Люди и работа","e":"👪","t":"Семья, часть 1","d":"sister, brother, son…","type":"w","items":["sister","brother","son","daughter","grandmother","grandfather"],"tip":"Родственников по-английски называют так: mother, father, sister, brother. Слово parents — это «родители», сразу оба."},{"id":"n_family_2","sec":"Люди и работа","e":"👪","t":"Семья, часть 2","d":"uncle, aunt, husband…","type":"w","items":["uncle","aunt","husband","wife","baby","parents"],"tip":"Слова husband и wife — «муж» и «жена». Притяжательное my ставится перед словом: my sister, my wife."},{"id":"n_jobs_1","sec":"Люди и работа","e":"💼","t":"Профессии, часть 1","d":"doctor, driver, cook…","type":"w","items":["doctor","driver","cook","nurse","engineer","singer"],"tip":"Профессию называют с артиклем: He is a doctor. Перед гласным звуком ставим an: She is an engineer."},{"id":"n_jobs_2","sec":"Люди и работа","e":"💼","t":"Профессии, часть 2","d":"farmer, artist, waiter…","type":"w","items":["farmer","artist","waiter","police officer","pilot","lawyer"],"tip":"Окончания -er и -ist часто показывают человека по профессии: singer, driver, artist."},{"id":"n_transport_1","sec":"Город и транспорт","e":"🚌","t":"Транспорт, часть 1","d":"car, bus, train…","type":"w","items":["car","bus","train","plane","bicycle","taxi"],"tip":"На транспорте ездят с предлогом by: by bus, by train, by car. Артикль после by не нужен."},{"id":"n_transport_2","sec":"Город и транспорт","e":"🚌","t":"Транспорт, часть 2","d":"ship, subway, road…","type":"w","items":["ship","subway","road","traffic","motorcycle","truck"],"tip":"Слово traffic — это сами пробки и поток машин, оно не считается: a lot of traffic."},{"id":"n_city_1","sec":"Город и транспорт","e":"🏙️","t":"Город, часть 1","d":"bridge, museum, restaurant…","type":"w","items":["bridge","museum","restaurant","supermarket","corner"],"tip":"Чтобы спросить дорогу, скажите: Where is the museum? Ответ: It is next to the bank."},{"id":"n_city_2","sec":"Город и транспорт","e":"🏙️","t":"Город, часть 2","d":"crossroads, traffic light, square…","type":"w","items":["crossroads","traffic light","square","church","stadium"],"tip":"Left — «левый, налево», right — «правый, направо», straight — «прямо». Эти слова нужны, чтобы объяснять дорогу."},{"id":"n_city_3","sec":"Город и транспорт","e":"🏙️","t":"Город, часть 3","d":"map, left, right…","type":"w","items":["map","left","right","straight"],"tip":"Left — «левый, налево», right — «правый, направо», straight — «прямо». Эти слова нужны, чтобы объяснять дорогу."},{"id":"n_feelings_1","sec":"Чувства и здоровье","e":"😊","t":"Чувства, часть 1","d":"happy, sad, angry…","type":"w","items":["happy","sad","angry","tired","hungry","scared"],"tip":"Чувства описывают с глаголом to be: I am happy. She is tired. Глагол feel тоже подходит: I feel sad."},{"id":"n_feelings_2","sec":"Чувства и здоровье","e":"😊","t":"Чувства, часть 2","d":"surprised, bored, excited…","type":"w","items":["surprised","bored","excited","proud","lonely","nervous"],"tip":"Окончания -ed в словах bored, excited, scared показывают, что чувствует человек. А -ing описывает то, что вызывает чувство."},{"id":"n_health_1","sec":"Чувства и здоровье","e":"🩺","t":"Здоровье, часть 1","d":"headache, medicine, fever…","type":"w","items":["headache","medicine","fever","cough","pain","healthy"],"tip":"О боли говорят с глаголом have: I have a headache. Ещё можно сказать: My head hurts — «У меня болит голова»."},{"id":"n_health_2","sec":"Чувства и здоровье","e":"🩺","t":"Здоровье, часть 2","d":"sick, pharmacy, appointment…","type":"w","items":["sick","pharmacy","appointment","allergy","rest"],"tip":"Слова sick и ill значат «больной». Sick чаще говорят в американском английском, ill — в британском."},{"id":"n_hobbies_1","sec":"Свободное время","e":"⚽","t":"Хобби и спорт, часть 1","d":"football, tennis, swimming…","type":"w","items":["football","tennis","swimming","running","drawing","dancing"],"tip":"С играми и спортом используют play: play football, play tennis, play chess. С музыкой — play the guitar, с артиклем the."},{"id":"n_hobbies_2","sec":"Свободное время","e":"⚽","t":"Хобби и спорт, часть 2","d":"singing, cooking, photography…","type":"w","items":["singing","cooking","photography","chess","guitar","hobby"],"tip":"Слова на -ing (swimming, running, dancing) называют занятие. Их можно ставить после like: I like swimming."},{"id":"n_tech_1","sec":"Свободное время","e":"💻","t":"Технологии, часть 1","d":"computer, laptop, internet…","type":"w","items":["computer","laptop","internet","password","message","video"],"tip":"Многие слова про технику звучат почти как в русском: computer, internet, video, app. Следите за ударением!"},{"id":"n_tech_2","sec":"Свободное время","e":"💻","t":"Технологии, часть 2","d":"camera, screen, charger…","type":"w","items":["camera","screen","charger","headphones","website","app"],"tip":"Слова message, video, password можно легко запомнить, если пользоваться телефоном по-английски."},{"id":"n_shopping_1","sec":"Покупки и еда","e":"🛍️","t":"Магазин и деньги, часть 1","d":"price, money, cheap…","type":"w","items":["price","money","cheap","expensive","bag"],"tip":"How much is it? — «Сколько это стоит?». Для нескольких вещей: How much are they?"},{"id":"n_shopping_2","sec":"Покупки и еда","e":"🛍️","t":"Магазин и деньги, часть 2","d":"card, cash, discount…","type":"w","items":["card","cash","discount","receipt"],"tip":"Cheap — «дешёвый», expensive — «дорогой». Для скидки говорят discount или sale."},{"id":"n_shopping_3","sec":"Покупки и еда","e":"🛍️","t":"Магазин и деньги, часть 3","d":"customer, size, buy…","type":"w","items":["customer","size","buy","sell"],"tip":"Cheap — «дешёвый», expensive — «дорогой». Для скидки говорят discount или sale."},{"id":"n_foods2_1","sec":"Покупки и еда","e":"🍌","t":"Продукты, часть 1","d":"banana, orange, potato…","type":"w","items":["banana","orange","potato","tomato","carrot"],"tip":"Некоторые продукты нельзя посчитать по штукам: rice, sugar, salt, cheese. Перед ними не ставят a, говорят some: some rice."},{"id":"n_foods2_2","sec":"Покупки и еда","e":"🍌","t":"Продукты, часть 2","d":"onion, cheese, egg…","type":"w","items":["onion","cheese","egg","rice","chicken"],"tip":"Egg, banana, tomato, carrot можно считать: one egg, two eggs."},{"id":"n_foods2_3","sec":"Покупки и еда","e":"🍌","t":"Продукты, часть 3","d":"sugar, salt, butter…","type":"w","items":["sugar","salt","butter","ice cream"],"tip":"Egg, banana, tomato, carrot можно считать: one egg, two eggs."},{"id":"n_kitchen2_1","sec":"Покупки и еда","e":"🍴","t":"Посуда, часть 1","d":"knife, fork, spoon…","type":"w","items":["knife","fork","spoon","plate","cup","glass"],"tip":"Посуду называют просто: knife, fork, spoon. Все три слова нужны за столом: knife and fork — «нож и вилка»."},{"id":"n_kitchen2_2","sec":"Покупки и еда","e":"🍴","t":"Посуда, часть 2","d":"bottle, fridge, oven…","type":"w","items":["bottle","fridge","oven","bowl","pan","napkin"],"tip":"Слова cup и glass — «чашка» и «стакан». Cup для чая и кофе, glass для воды и сока."},{"id":"n_days_1","sec":"Время","e":"📅","t":"Дни недели, часть 1","d":"Monday, Tuesday, Wednesday…","type":"w","items":["Monday","Tuesday","Wednesday","Thursday"],"tip":"Названия дней всегда пишутся с большой буквы: Monday, Friday. С днями используют on: on Monday, on Sunday."},{"id":"n_days_2","sec":"Время","e":"📅","t":"Дни недели, часть 2","d":"Friday, Saturday, Sunday…","type":"w","items":["Friday","Saturday","Sunday","weekend"],"tip":"Yesterday — «вчера», today — «сегодня», tomorrow — «завтра». Выходные — weekend, и говорят at the weekend."},{"id":"n_months_1","sec":"Время","e":"🗓️","t":"Месяцы, часть 1","d":"January, February, March…","type":"w","items":["January","February","March","April","May","June"],"tip":"Месяцы тоже пишутся с большой буквы. С месяцами используют in: in May, in December."},{"id":"n_months_2","sec":"Время","e":"🗓️","t":"Месяцы, часть 2","d":"July, August, September…","type":"w","items":["July","August","September","October","November","December"],"tip":"Даты говорят так: on the fifth of May. А год называют двумя числами: 2026 — twenty twenty-six."},{"id":"n_nature_1","sec":"Мир вокруг","e":"🌲","t":"Природа, часть 1","d":"tree, flower, river…","type":"w","items":["tree","flower","river","mountain","sea","forest"],"tip":"Слова tree, flower, river звучат просто. Их легко учить на прогулке: смотрите по сторонам и называйте, что видите."},{"id":"n_nature_2","sec":"Мир вокруг","e":"🌲","t":"Природа, часть 2","d":"moon, star, lake…","type":"w","items":["moon","star","lake","grass","beach","island"],"tip":"Перед единственными в своём роде вещами ставят the: the sun, the moon, the sea."},{"id":"n_verbs2_1","sec":"Слова-помощники","e":"🏃","t":"Глаголы 2, часть 1","d":"come, give, take…","type":"w","items":["come","give","take","know","think"],"tip":"Эти глаголы нужны в каждом разговоре. С he, she, it добавляем -s: she works, he knows."},{"i     const u=new SpeechSynthesisUtterance(text);u.lang="en-US";u.rate=(S.set.rate||.9)*(slow?.6:1);if(enVoice)u.voice=enVoice;
    speechSynthesis.cancel();speechSynthesis.resume();speechSynthesis.speak(u);return true;
  }catch(e){return false}
}
function cloudSay(text,slow,i){
  i=i||0;const my=AU.sayId;
  if(i>=TTS.length){
    if(my===AU.sayId){nativeSay(text,slow);if(!AU.warned){AU.warned=1;toast("🔇 Не удалось загрузить голос. Проверьте интернет.")}}
    return;
  }
  try{
    if(AU.tts)AU.tts.pause();
    const a=new Audio();a.preload="auto";a.src=TTS[i](text);a.playbackRate=slow?.7:1;AU.tts=a;
    let failed=false;const fail=()=>{if(failed||my!==AU.sayId)return;failed=true;cloudSay(text,slow,i+1)};
    a.onerror=fail;
    const p=a.play();
    if(p&&p.catch)p.catch(e=>{if(e&&e.name==="NotAllowedError"){if(!AU.warned2){AU.warned2=1;toast("🔊 Нажмите на кнопку динамика, чтобы услышать слово")}}else fail()});
  }catch(e){cloudSay(text,slow,i+1)}
}
/* Pre-recorded files: audio/<hash>.mp3 (made by scripts/generate_audio.py) */
function h32(s){let h=0x811c9dc5;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0}return h.toString(16).padStart(8,"0")}
const AUDIO_API=""; /* адрес твоего Worker, например https://имя.workers.dev */
function fileSay(text,slow,onFail){
  try{
    if(AU.tts)AU.tts.pause();
    const a=new Audio(AUDIO_API?AUDIO_API+"/tts?t="+encodeURIComponent(text):"audio/"+h32(text)+".mp3");a.preload="auto";a.playbackRate=slow?.7:1;AU.tts=a;
    let f=false;const fail=()=>{if(!f){f=true;onFail()}};
    a.onerror=fail;
    const p=a.play();
    if(p&&p.catch)p.catch(e=>{if(e&&e.name==="NotAllowedError"){if(!AU.warned2){AU.warned2=1;toast("🔊 Нажмите на кнопку динамика, чтобы услышать слово")}}else fail()});
  }catch(e){onFail()}
}
function say(text,slow){
  const my=AU.sayId=(AU.sayId||0)+1;
  try{speechSynthesis.cancel()}catch(e){}
  fileSay(text,slow,()=>{if(my===AU.sayId)sayFallback(text,slow,my)});
}
function sayFallback(text,slow,my){
  let native=false;
  try{native=("speechSynthesis" in window)&&typeof SpeechSynthesisUtterance!=="undefined"}catch(e){}
  try{if(AU.tts)AU.tts.pause()}catch(e){}
  if(!native)return cloudSay(text,slow);
  let n=0;try{n=speechSynthesis.getVoices().length}catch(e){}
  if(!n||!hasEnVoice())return cloudSay(text,slow);
  try{
    const u=new SpeechSynthesisUtterance(text);u.lang="en-US";u.rate=(S.set.rate||.9)*(slow?.6:1);if(enVoice)u.voice=enVoice;
    let started=false;u.onstart=()=>{started=true};
    u.onerror=e=>{if(!started&&my===AU.sayId&&e.error!=="canceled"&&e.error!=="interrupted")cloudSay(text,slow)};
    speechSynthesis.cancel();speechSynthesis.resume();speechSynthesis.speak(u);
    setTimeout(()=>{if(!started&&my===AU.sayId&&!speechSynthesis.speaking)cloudSay(text,slow)},1500);
  }catch(e){cloudSay(text,slow)}
}

function confetti(n){
  n=n||110;const c=$("#cf"),x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;
  const cols=["#d8bf8a","#c8a96a","#f3efe7","#b08d4c","#ecdcb5"];
  const P=Array.from({length:n},()=>({x:innerWidth/2,y:innerHeight*.4,vx:(Math.random()-.5)*15,vy:-Math.random()*14-3,s:Math.random()*8+4,c:cols[Math.random()*5|0],r:Math.random()*6,vr:(Math.random()-.5)*.4,l:1}));
  (function f(){
    x.clearRect(0,0,c.width,c.height);let alive=0;
    P.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.l-=.007;
      if(p.l>0&&p.y<c.height){alive++;x.save();x.globalAlpha=p.l;x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()}});
    if(alive)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height);
  })();
}

/* ---- generic multiple choice ---- */
function choiceGame(id,title,items,make){
  let i=0,score=0,combo=0,locked=false;const n=items.length;
  function step(){
    if(i>=n)return finish(id,title,score,n);
    const q=make(items[i]);
    view.innerHTML=`<button class="back" id="bk">← Игры</button>
    <div class="between"><span class="muted">${title} · ${i+1}/${n}</span><span class="combo">${combo>1?"🔥 комбо x"+combo:""}</span></div>
    <div class="bar"><div style="width:${i/n*100}%"></div></div>
    <div class="card center prompt">${q.prompt}${q.say?'<button class="icon" id="sp" style="margin-top:8px">🔊</button>':''}</div>
    <div>${q.opts.map((o,k)=>`<button class="opt" data-k="${k}">${o.t}</button>`).join("")}</div>`;
    $("#bk").onclick=Play;
    if(q.say){$("#sp").onclick=()=>say(q.say);if(q.auto)later(()=>say(q.say),350)}
    locked=false;
    const btns=view.querySelectorAll(".opt");
    btns.forEach(b=>b.onclick=()=>{
      if(locked)return;locked=true;
      const o=q.opts[b.dataset.k];
      if(o.ok){b.classList.add("ok");score++;combo++;answer(true);if(combo>=3){gainXP(combo>=5?5:2);SFX.coin()}}
      else{b.classList.add("bad");combo=0;answer(false);btns.forEach((x,k)=>{if(q.opts[k].ok)x.classList.add("ok")})}
      later(()=>{i++;step()},1000);
    });
  }
  step();
}
function finish(id,title,score,max){stat("game-played","Игра сыграна");try{contentHook(id,score,max)}catch(e){console.error(e)}
  const ratio=score/max;
  if(S.bests[id]==null||score>S.bests[id])S.bests[id]=score;
  if(score===max)S.flags.perfect=1;
  const bonus=score*3;gainXP(bonus);
  if(ratio>=.8){SFX.level();confetti()}
  save();checkAch();
  const st=ratio>=.9?3:ratio>=.6?2:ratio>=.3?1:0;
  view.innerHTML=`<div class="card center hero" style="padding:28px 16px">
    <div class="muted">${title}</div>
    <div class="stars">${"⭐".repeat(st)}${"☆".repeat(3-st)}</div>
    <div class="big">${score}/${max}</div>
    <div class="muted" style="margin-top:6px">${ratio>=.8?"Отлично! Excellent! 🎉":ratio>=.5?"Неплохо, продолжайте 👍":"Повторите слова и попробуйте снова 💪"}</div>
    <div class="muted" style="margin-top:6px">Бонус +${bonus} XP</div></div>
    <div class="row"><button class="btn" id="again">Ещё раз</button><button class="btn ghost" id="menu">Игры</button></div>`;
  $("#again").onclick=()=>startGame(id);$("#menu").onclick=Play;
}

/* ---- word builder ---- */
function buildGame(){
  const pool=shuffle(ALL.filter(w=>/^[a-z]{3,}$/i.test(w.en))).slice(0,6);
  let r=0,score=0;
  function round(){
    if(r>=pool.length)return finish("build","Собери слово",score,pool.length);
    const w=pool[r],word=w.en.toLowerCase();
    let letters=shuffle(word.split(""));
    if(letters.join("")===word)letters.reverse();
    let slots=Array(word.length).fill(null),failed=false,locked=false;
    function draw(){
      view.innerHTML=`<button class="back" id="bk">← Игры</button>
      <div class="between"><span class="muted">Собери слово · ${r+1}/${pool.length}</span></div>
      <div class="bar"><div style="width:${r/pool.length*100}%"></div></div>
      <div class="card center"><div class="muted">Напишите это слово по-английски</div><div class="en2">${w.ru}</div><div class="muted">[${w.tr}]</div>
      <button class="icon" id="sp" style="margin-top:8px">🔊</button></div>
      <div class="slots" id="sl">${slots.map((s,k)=>`<button class="slot${s!==null?" f":""}" data-k="${k}">${s!==null?letters[s].toUpperCase():""}</button>`).join("")}</div>
      <div class="tiles">${letters.map((l,k)=>slots.includes(k)?`<button class="tile used" disabled>${l.toUpperCase()}</button>`:`<button class="tile" data-k="${k}">${l.toUpperCase()}</button>`).join("")}</div>`;
      $("#bk").onclick=Play;$("#sp").onclick=()=>say(w.en);
      view.querySelectorAll(".tile:not(.used)").forEach(t=>t.onclick=()=>{
        if(locked)return;const e=slots.indexOf(null);if(e<0)return;
        slots[e]=+t.dataset.k;SFX.pop();draw();
        if(!slots.includes(null))check();
      });
      view.querySelectorAll(".slot").forEach(s=>s.onclick=()=>{
        if(locked)return;if(slots[s.dataset.k]!==null){slots[s.dataset.k]=null;SFX.tap();draw()}
      });
    }
    function check(){
      locked=true;
      const built=slots.map(s=>letters[s]).join("");
      if(built===word){
        view.querySelectorAll(".slot").forEach(s=>s.classList.add("okk"));
        answer(true);say(w.en);if(!failed)score++;
        later(()=>{r++;round()},1100);
      }else{
        failed=true;answer(false);$("#sl").classList.add("shake");
        later(()=>{slots=Array(word.length).fill(null);locked=false;draw()},600);
      }
    }
    draw();
  }
  round();
}

function game2(id){
  const MQ=(g,t,fn)=>choiceGame(g,t,shuffle(MEMES).slice(0,8),fn);
  if(id==="meme")return MQ("meme","Мем-квиз",m=>{const w=WORD[m.w];return{prompt:`${memeSVG(m)}<div class="muted" style="margin-top:10px">Что значит «${w.en}»?</div>`,say:w.en==="6-7"?"six seven":w.en,opts:shuffle([{t:w.ru,ok:1},...shuffle(MEMES.filter(x=>x.w!==m.w)).slice(0,3).map(x=>({t:WORD[x.w].ru}))])}});
  if(id==="memecap")return MQ("memecap","Дополни мем",m=>({prompt:`${memeSVG({...m,bot:"???"})}<div class="muted" style="margin-top:10px">Какая подпись подходит?</div>`,opts:shuffle([{t:m.bot,ok:1},...shuffle(MEMES.filter(x=>x.bot!==m.bot)).slice(0,3).map(x=>({t:x.bot}))])}));
  if(id==="tf")return choiceGame("tf","Верно или нет",shuffle(ALL).slice(0,10),w=>{const ok=Math.random()<.5,sh=ok?w.ru:shuffle(ALL.filter(x=>x.ru!==w.ru))[0].ru;return{prompt:`<div class="muted">Это правильный перевод?</div><div class="en">${w.en}</div><div class="en2">${sh}</div>`,say:w.en,opts:[{t:"✅ Верно",ok:ok?1:0},{t:"❌ Неверно",ok:ok?0:1}]}});
  if(id==="gap"){
    const SW=TOPICS.sent.words,bank=[...new Set(SW.flatMap(x=>x[0].replace(/[.?!,]/g,"").split(" ").filter(z=>z.length>2).map(z=>z.toLowerCase())))];

/* ---- online translation with fallbacks (shared by "Моя песня" and "Спой на английском") ---- */
const TRC={};
async function tfetch(url,ms){
  const c=typeof AbortController!=="undefined"?new AbortController():null,tm=setTimeout(()=>{try{c&&c.abort()}catch(e){}},ms||9000);
  try{const r=await fetch(url,c?{signal:c.signal}:undefined);if(!r.ok)throw new Error("http "+r.status);return await r.json()}
  finally{clearTimeout(tm)}
}
const TR_PROVIDERS=[
  async(t,f,o)=>{const j=await tfetch("https://translate.googleapis.com/translate_a/single?client=gtx&dt=t&sl="+f+"&tl="+o+"&q="+encodeURIComponent(t));
    return((j&&j[0])||[]).map(s=>(s&&s[0])||"").join("")},
  async(t,f,o)=>{const j=await tfetch("https://api.mymemory.translated.net/get?q="+encodeURIComponent(t)+"&langpair="+f+"|"+o);
    const x=j&&j.responseData&&j.responseData.translatedText;
    if(!x||+j.responseStatus!==200||/MYMEMORY WARNING|INVALID|QUERY LENGTH|PLEASE SELECT/i.test(x))throw new Error("mm");
    const d=document.createElement("textarea");d.innerHTML=x;return d.value},
  async(t,f,o)=>{const j=await tfetch("https://lingva.ml/api/v1/"+f+"/"+o+"/"+encodeURIComponent(t));return(j&&j.translation)||""},
  /* works only where api.anthropic.com is reachable without a key (the claude.ai preview); fails fast elsewhere */
  async(t,f,o)=>{
    const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:300,messages:[{role:"user",content:"Translate this song lyric line from "+(f==="ru"?"Russian":"English")+" to "+(o==="en"?"English":"Russian")+". Reply with only the translation: no quotes, no comments.\n\n"+t}]})});
    if(!r.ok)throw new Error("api");const j=await r.json();return((j&&j.content)||[]).map(x=>x.text||"").join("").trim()}
];
async function trAuto(t,from,to){
  t=String(t).trim();if(!t)throw new Error("empty");
  const key=from+"|"+to+"|"+t;if(TRC[key])return TRC[key];
  const cyr=s=>(s.match(/[а-яё]/gi)||[]).length,lat=s=>(s.match(/[a-z]/gi)||[]).length;
  for(const p of TR_PROVIDERS){
    try{
      const x=String(await p(t,from,to)||"").trim();
      if(!x||x.toLowerCase()===t.toLowerCase())continue;
      if(to==="en"&&cyr(x)>lat(x))continue;
      if(to==="ru"&&lat(x)>cyr(x))continue;
      return TRC[key]=x;
    }catch(e){}
  }
  throw new Error("tr");
}

const PB=[["я не знаю","I don't know"],["я люблю тебя","I love you"],["я тебя люблю","I love you"],["ты мне нужна","I need you"],["ты мне нужен","I need you"],["ты нужна мне","I need you"],["ты нужен мне","I need you"],["я скучаю","I miss you"],["я скучаю по тебе","I miss you"],["не уходи","Don't go"],["останься","Stay"],["останься со мной","Stay with me"],["мне всё равно","I don't care"],["я всё помню","I remember everything"],["я помню","I remember"],["ты меня слышишь","Can you hear me"],["прости меня","Forgive me"],["прости","I'm sorry"],["я не могу без тебя","I can't live without you"],["я не хочу","I don't want to"],["я хочу домой","I want to go home"],["всё будет хорошо","Everything will be fine"],["мы вместе","We are together"],["я здесь","I'm here"],["я рядом","I'm right here"],["я один","I'm alone"],["я одна","I'm alone"],["не плачь","Don't cry"],["не бойся","Don't be afraid"],["дай мне руку","Give me your hand"],["ты моя любовь","You are my love"],["ты мой свет","You are my light"],["я верю","I believe"],["я не верю","I don't believe it"],["я жду тебя","I'm waiting for you"],["я иду к тебе","I'm coming to you"],["давай танцевать","Let's dance"],["давай потанцуем","Let's dance"],["куда ты идёшь","Where are you going"],["что ты хочешь","What do you want"],["ты не один","You are not alone"],["ты не одна","You are not alone"],["ты красивая","You are beautiful"],["ты со мной","You are with me"],["я забыл","I forgot"],["я забыла","I forgot"],["я не понимаю","I don't understand"],["я не могу","I can't"],["я не буду","I won't"],["ты знаешь","You know"],["ты где","Where are you"],["я тут","I'm here"],["до свидания","Goodbye"]];
const PBm={},PBr={};
const nrm=s=>String(s).toLowerCase().replace(/ё/g,"е").replace(/[^\p{L}\p{N}' ]+/gu," ").replace(/\s+/g," ").trim();
PB.forEach(([r,e])=>{PBm[nrm(r)]=e;if(!PBr[nrm(e)])PBr[nrm(e)]=r});
async function trLines(lines,from,to){
  const book=from==="ru"?PBm:PBr,out=lines.map(l=>book[nrm(l)]||null),need=out.map((x,i)=>x?-1:i).filter(i=>i>=0);
  if(!need.length)return out;
  const cyr=s=>(s.match(/[а-яё]/gi)||[]).length,lat=s=>(s.match(/[a-z]/gi)||[]).length;
  let done=false;
  if(need.length>1){ /* one request for the whole text, so each line is translated in context */
    try{
      const x=await TR_PROVIDERS[0](need.map(i=>lines[i]).join("\n"),from,to);
      const parts=String(x).split(/\n+/).map(t=>t.trim()).filter(Boolean);
      if(parts.length===need.length&&parts.every((t,k)=>t.toLowerCase()!==lines[need[k]].toLowerCase()&&(to==="en"?cyr(t)<=lat(t):lat(t)<=cyr(t)))){need.forEach((i,k)=>out[i]=parts[k]);done=true}
    }catch(e){}
  }
  if(!done)await Promise.all(need.map(async i=>{try{out[i]=await trAuto(lines[i],from,to)}catch(e){out[i]=null}}));
  return out;
}

      view.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>say(items[+b.dataset.s].en));
      $("#nw").onclick=setup;$("#mn").onclick=Play;
    }
    round();
  }
  setup();
}

  <div class="between"><span class="muted">${l.t} · Практика</span><span class="combo">${LS.combo>1?"🔥 x"+LS.combo:""}</span></div>

  <div>${q.opts.map((o,k)=>`<button class="opt" data-k="${k}">${o.t}</button>`).join("")}</div>`;
  $("#bk").onclick=Learn;
  if(q.say){$("#sp").onclick=()=>say(q.say);$("#sl").onclick=()=>say(q.say,true);if(q.auto)later(()=>say(q.say),350)}
  const btns=view.querySelectorAll(".opt");
  btns.forEach(b=>b.onclick=()=>{
    if(locked)return;locked=true;
    const o=q.opts[b.dataset.k];
    if(o.ok){
      b.classList.add("ok");LS.done++;if(cur.first)LS.right++;LS.combo++;answer(true);
      if(q.after)later(()=>say(q.after),250);
    }else{
      b.classList.add("bad");LS.combo=0;answer(false);
      btns.forEach((x,k)=>{if(q.opts[k].ok)x.classList.add("ok")});
      const ts=LS.types;
      LS.q.push({it:cur.it,type:ts[(ts.indexOf(cur.type)+1)%ts.length],first:false});
      if(q.after)later(()=>say(q.after),250);

}
function lessonEnd(){
  const l=LESSONS[LS.i],n=LS.n,pct=LS.right/n,pass=pct>=.7;
  const stars=pct>=.95?3:pct>=.8?2:1;let first=false;
  if(pass){
    const old=S.lessons[l.id];first=!old;
    S.lessons[l.id]={stars:Math.max(stars,old?old.stars:0)};stat("lesson-done","Урок пройден");dqAdd("les");
    LS.items.forEach(it=>{if(it.k==="w"&&!S.known.includes(it.en))S.known.push(it.en)});
    gainXP(15+LS.right*3+(first?30:0));
    if(stars>=2){SFX.level();confetti()}else SFX.ok();
  }else SFX.bad();
  save();checkAch();hud();
  const hasNext=LS.i<LESSONS.length-1;
  view.innerHTML=`<div class="card center hero" style="padding:28px 16px"><div class="muted">${l.t}</div>
    <div class="stars">${pass?"⭐".repeat(stars)+"☆".repeat(3-stars):"💪"}</div>
    <div class="big">${LS.right}/${n}</div>
    <div class="muted" style="margin-top:6px">${pass?(first?"Урок пройден! Следующий урок открыт 🎉":"Урок засчитан ✔"):"Нужно набрать минимум 70%. Повторите материал и попробуйте снова."}</div>
    <div class="muted" style="margin-top:4px">Считаются правильные ответы с первой попытки</div></div>
    ${pass&&hasNext?'<div class="row"><button class="btn gold" id="nl">Следующий урок →</button></div>':''}
    <div class="row"><button class="btn ghost" id="rv">📖 Повторить</button><button class="btn" id="pa">🎯 Практика ещё раз</button></div>
    <div class="row"><button class="btn ghost" id="ls">Все уроки</button></div>`;
  if($("#nl"))$("#nl").onclick=()=>startLesson(LS.i+1);
  $("#rv").onclick=()=>{LS.t=0;teachStep()};
  $("#pa").onclick=startPractice;
  $("#ls").onclick=Learn;
}

ания (do / does)","e":"❔","d":"Do you like tea?","html":"<p>В Present Simple вопрос и отрицание строят с помощью <b>do / does</b>.</p>\n<table class=\"gt\"><tr><td>I / you / we / they</td><td><b>do</b> / <b>don't</b></td></tr><tr><td>he / she / it</td><td><b>does</b> / <b>doesn't</b></td></tr></table>\n<p><i>Do you like tea? — Yes, I do.</i><br><i>She doesn't work on Sunday.</i></p>\n<p>После do / does основной глагол стоит <b>без -s</b>: <i>Does she work?</i> (а не works).</p>","say":["Do you like tea?","She does not work on Sunday.","Does he play football?"],"ex":[["___ you like tea?","Ты любишь чай?",["Do","Does","Are"],0],["She ___ work on Sunday.","Она не работает по воскресеньям.",["don't","doesn't","isn't"],1],["___ he play football?","Он играет в футбол?",["Do","Is","Does"],2],["I ___ know this word.","Я не знаю это слово.",["doesn't","don't","not"],1],["Does she ___ English?","Она говорит по-английски?",["speak","speaks","speaking"],0],["They ___ live here.","Они здесь не живут.",["doesn't","don't","aren't"],1],["What ___ you do?","Чем ты занимаешься?",["do","does","are"],0]]},{"id":"g6","t":"can / can't","e":"💪","d":"I can swim","html":"<p><b>can</b> — «мочь, уметь». После него глагол <b>без to и без -s</b>.</p>\n<p><i>I can swim. She can sing. He can't drive.</i></p>\n<p>Вопрос: <i>Can you help me?</i> Вежливая просьба: <i>Could you help me, please?</i></p>","say":["I can swim.","She can sing well.","Can you help me?"],"ex":[["I ___ swim.","Я умею плавать.",["can","cans","can to"],0],["She ___ sing very well.","Она очень хорошо поёт.",["can","cans","is can"],0],["He ___ drive. He is only ten.","Он не умеет водить. Ему всего десять.",["can","can't","don't"],1],["___ you help me?","Ты можешь мне помочь?",["Do","Can","Are"],1],["Birds can ___.","Птицы умеют летать.",["fly","flies","to fly"],0],["My dog ___ speak.","Моя собака не умеет говорить.",["can't","don't","isn't"],0],["___ I open the window?","Можно открыть окно?",["Can","Do","Am"],0]]},{"id":"g7","t":"There is / There are","e":"📍","d":"There is a cat","html":"<p>Чтобы сказать, что что-то есть или находится где-то, используем:</p>\n<table class=\"gt\"><tr><td>одно</td><td><b>There is</b> a cat.</td></tr><tr><td>много</td><td><b>There are</b> two cats.</td></tr></table>\n<p>Отрицание: <i>There isn't a bank here. There aren't any shops.</i> Вопрос: <i>Is there a bank here?</i></p>","say":["There is a cat on the sofa.","There are two books on the table."],"ex":[["There ___ a cat on the sofa.","На диване кошка.",["is","are","am"],0],["There ___ two books on the table.","На столе две книги.",["is","are","be"],1],["___ there a bank near here?","Здесь рядом есть банк?",["Are","Is","Do"],1],["There ___ any milk.","Молока нет.",["isn't","aren't","don't"],0],["There ___ many people in the park.","В парке много людей.",["is","are","has"],1],["There ___ a lot of snow.","Много снега.",["are","is","do"],1],["___ there any shops?","Здесь есть магазины?",["Is","Are","Do"],1]]},{"id":"g8","t":"Present Continuous","e":"⏳","d":"I am reading","html":"<p><b>Present Continuous</b> — действие происходит прямо сейчас: <i>I am reading now.</i></p>\n<p>Формула: <b>am / is / are + глагол с -ing</b>.</p>\n<p><i>She is cooking. They are playing. I am not sleeping.</i></p>\n<p>Правило написания: <i>write → writing, run → running, swim → swimming</i>.</p>","say":["I am reading now.","She is cooking dinner.","They are playing football."],"ex":[["I am ___ now.","Я сейчас читаю.",["read","reading","reads"],1],["She ___ cooking dinner.","Она готовит ужин.",["are","is","am"],1],["They ___ playing football.","Они играют в футбол.",["is","are","am"],1],["He is ___ a letter.","Он пишет письмо.",["writeing","writing","writting"],1],["We ___ not sleeping.","Мы не спим.",["is","am","are"],2],["The kids are ___ in the pool.","Дети плавают в бассейне.",["swiming","swimming","swimmeing"],1],["___ you listening?","Ты слушаешь?",["Is","Are","Do"],1]]},{"id":"g9","t":"Past Simple","e":"⏪","d":"I played, I went","html":"<p><b>Past Simple</b> — прошедшее действие: <i>I played football yesterday.</i></p>\n<p>Правильные глаголы + <b>-ed</b>: <i>play → played, work → worked, study → studied</i>.</p>\n<p>Неправильные глаголы нужно запомнить: <i>go → went, eat → ate, see → saw, have → had, buy → bought, take → took, write → wrote</i>.</p>\n<p>Вопрос и отрицание: <b>did / didn't</b> + основная форма: <i>Did you go? I didn't go.</i></p>","say":["I played football yesterday.","She went to the shop.","Did you see the film?"],"ex":[["I ___ football yesterday.","Вчера я играл в футбол.",["play","played","playd"],1],["She ___ to the shop.","Она ходила в магазин.",["goed","went","gone"],1],["We ___ pizza last night.","Вчера вечером мы ели пиццу.",["ate","eated","eat"],0],["He ___ a new phone.","Он купил новый телефон.",["buyed","bought","buys"],1],["___ you see the film?","Ты видел этот фильм?",["Do","Did","Does"],1],["I ___ go to school on Sunday.","Я не ходил в школу в воскресенье.",["don't","didn't","wasn't"],1],["They ___ a letter.","Они написали письмо.",["wrote","writed","write"],0]]},{"id":"g10","t":"Сравнения","e":"⚖️","d":"bigger, more interesting","html":"<p>Короткие прилагательные + <b>-er</b>: <i>big → bigger, fast → faster, cold → colder</i>. Потом слово <b>than</b>: <i>My bag is bigger than yours.</i></p>\n<p>Длинные прилагательные: <b>more</b> + слово: <i>more interesting, more expensive</i>.</p>\n<p>Исключения: <i>good → better, bad → worse</i>.</p>\n<p>Самая-самая степень: <b>the + -est</b> или <b>the most</b>: <i>the biggest, the most interesting</i>.</p>","say":["My bag is bigger than yours.","This book is more interesting.","He is the tallest."],"ex":[["A car is ___ than a bike.","Машина быстрее велосипеда.",["fast","faster","more fast"],1],["This film is ___ than that one.","Этот фильм интереснее того.",["more interesting","interestinger","most interesting"],0],["Today is ___ than yesterday.","Сегодня холоднее, чем вчера.",["more cold","colder","coldest"],1],["This is the ___ cake.","Это самый вкусный торт.",["better","best","good"],1],["My English is ___ now.","Мой английский стал лучше.",["gooder","better","more good"],1],["He is the ___ in the class.","Он самый высокий в классе.",["tall","taller","tallest"],2],["This phone is ___ than mine.","Этот телефон дороже моего.",["more expensive","expensiver","most expensive"],0]]},{"id":"g11","t":"Притяжательные","e":"🏷️","d":"my, your, his, her, 's","html":"<p>Чтобы сказать «мой, твой...» ставим слово перед существительным:</p>\n<table class=\"gt\"><tr><td>I → <b>my</b></td><td>we → <b>our</b></td></tr><tr><td>you → <b>your</b></td><td>they → <b>their</b></td></tr><tr><td>he → <b>his</b></td><td>she → <b>her</b>, it → <b>its</b></td></tr></table>\n<p>Принадлежность человеку: <b>'s</b>: <i>Anna's bag, my brother's room</i>.</p>\n<p>Не путайте: <b>its</b> (принадлежит) и <b>it's</b> (это it is).</p>","say":["This is my bag.","Her name is Anna.","It is Tom's book."],"ex":[["This is ___ bag. (я)","Это моя сумка.",["my","me","I"],0],["___ name is Anna. (она)","Её зовут Анна.",["She","Her","Hers"],1],["We love ___ school. (мы)","Мы любим нашу школу.",["we","us","our"],2],["They like ___ teacher. (они)","Им нравится их учитель.",["they","their","them"],1],["It is ___ book. (Том)","Это книга Тома.",["Tom","Toms","Tom's"],2],["He loves ___ dog. (он)","Он любит свою собаку.",["him","his","he"],1],["Is this ___ phone? (ты)","Это твой телефон?",["you","your","yours"],1]]},{"id":"g12","t":"This / That / These / Those","e":"👉","d":"этот, тот, эти, те","html":"<p><b>this</b> (этот) и <b>these</b> (эти) — о том, что рядом. <b>that</b> (тот) и <b>those</b> (те) — о том, что далеко.</p>\n<table class=\"gt\"><tr><td></td><td>рядом</td><td>далеко</td></tr><tr><td>один</td><td><b>this</b></td><td><b>that</b></td></tr><tr><td>много</td><td><b>these</b></td><td><b>those</b></td></tr></table>\n<p><i>This is my book. Those are your shoes.</i></p>","say":["This is my book.","That house is big.","These are my shoes."],"ex":[["___ is my book. (в руке)","Это моя книга.",["That","This","Those"],1],["___ house over there is big.","Тот дом вон там большой.",["This","That","These"],1],["___ are my shoes. (рядом)","Это мои туфли.",["These","This","Those"],0],["___ birds are far away.","Те птицы далеко.",["These","That","Those"],2],["Who is ___ man? (далеко)","Кто тот мужчина?",["this","that","these"],1],["I like ___ apples here.","Мне нравятся эти яблоки здесь.",["these","this","that"],0],["What is ___? (в руке)","Что это?",["that","this","those"],1]]}];

const GLALL=(()=>{const m={};STORIES.forEach(s=>Object.assign(m,s.gl));return m})();
const LKW=(()=>{const m={};for(const k in WORD){if(!k.includes(" ")&&!k.includes("?")&&!k.includes("."))m[k.toLowerCase()]=WORD[k].ru}return m})();
function lookupWord(raw,s){
  const w=raw.toLowerCase().replace(/[^a-z'-]/g,"").replace(/'s$/,"");if(!w)return null;
  const g=s&&s.gl||{},tries=[w,w.replace(/s$/,""),w.replace(/es$/,""),w.replace(/ed$/,""),w.replace(/ing$/,""),w.replace(/ly$/,"")];
  for(const t of tries){if(g[t])return g[t];if(COMMON[t])return COMMON[t];if(LKW[t])return LKW[t];if(GLALL[t])return GLALL[t]}
  return null;
}

/* called from finish(): records results of story and grammar quizzes and counts quests */
function contentHook(id,score,max){
  const r=score/max,stars=r>=.9?3:r>=.6?2:1;
  if(id.startsWith("st:")){S.stories=S.stories||{};const k=id.slice(3),o=S.stories[k];if(r>=.6){S.stories[k]={stars:Math.max(stars,o?o.stars:0)};dqAdd("story");stat("story-read","История прочитана")}}
  else if(id.startsWith("gr:")){S.gram=S.gram||{};const k=id.slice(3),o=S.gram[k];if(r>=.6){S.gram[k]={stars:Math.max(stars,o?o.stars:0)};dqAdd("gram");stat("grammar-done","Грамматика пройдена")}}
  else dqAdd("games");
}

function readStory(i){
  nav();const my=VT,s=STORIES[i];let ru=false,playing=false,tm=0;
  view.innerHTML=`<button class="back" id="bk">← Истории</button>
  <div class="between"><h2 style="margin:6px 0">${s.e} ${esc(s.t)}</h2><span class="muted">${s.lv}</span></div>
  <div class="row" style="margin-top:6px"><button class="btn ghost" id="pl">▶ Слушать всё</button><button class="btn ghost" id="tg">🇷🇺 Перевод: выкл</button></div>
  <div class="card" id="sb">${s.lines.map((l,k)=>`<div class="sline" data-k="${k}"><button class="icon sp" data-sp="${k}">🔊</button><div class="sx"><div class="sen">${l[0].split(/(\s+)/).map(w=>/\S/.test(w)?`<span class="wt">${esc(w)}</span>`:w).join("")}</div><div class="sru">${esc(l[1])}</div></div></div>`).join("")}</div>

  const stop=()=>{playing=false;clearTimeout(tm);$("#pl")&&($("#pl").textContent="▶ Слушать всё");view.querySelectorAll(".sline.cur").forEach(e=>e.classList.remove("cur"))};
  $("#bk").onclick=()=>{stop();Stories()};
  $("#tg").onclick=()=>{ru=!ru;$("#sb").classList.toggle("showru",ru);$("#tg").textContent="🇷🇺 Перевод: "+(ru?"вкл":"выкл");SFX.tap()};
  view.querySelectorAll("[data-sp]").forEach(b=>b.onclick=e=>{e.stopPropagation();stop();const k=+b.dataset.sp;say(s.lines[k][0])});
  view.querySelectorAll(".wt").forEach(w=>w.onclick=e=>{
    e.stopPropagation();view.querySelectorAll(".wt.on").forEach(x=>x.classList.remove("on"));w.classList.add("on");
    const t=w.textContent,tr=lookupWord(t,s);say(t.replace(/[^A-Za-z']/g,""));

  });
  view.querySelectorAll(".sline").forEach(l=>l.onclick=()=>l.classList.toggle("tr"));
  $("#pl").onclick=()=>{
    if(playing){stop();return}
    playing=true;$("#pl").textContent="■ Остановить";let k=0;

    };next();
  };
  $("#qz").onclick=()=>{stop();SFX.pop();storyQuiz(s.id)};
}

function grammarQuiz(id){
  const g=GRAMMAR.find(x=>x.id===id);
  choiceGame("gr:"+id,g.t,shuffle(g.ex).slice(0,6),q=>({
    prompt:`<div class="muted">Вставь подходящее слово</div><div class="en2" style="font-size:26px">${esc(q[0]).replace("___",'<span class="blank">_____</span>')}</div><div class="muted">${esc(q[1])}</div>`,
    opts:shuffle(q[2].map((t,k)=>({t:esc(t),ok:k===q[3]?1:0})))}));
}

/* any picture -> frame: if it has transparency it is kept as it is; otherwise the background (light or dark) is cut out and the art is tinted with the theme colour */
function frameFromImage(im){
  const N=360,c=document.createElement("canvas");c.width=c.height=N;const x=c.getContext("2d",{willReadFrequently:true}),r=Math.min(N/im.width,N/im.height),w=im.width*r,h=im.height*r;
  x.drawImage(im,(N-w)/2,(N-h)/2,w,h);
  const id=x.getImageData(0,0,N,N),d=id.data;let tr=0;
  for(let i=3;i<d.length;i+=4)if(d[i]<250)tr++;
  const col=tr>N*N*.03;let al=new Float32Array(N*N);
  if(col){for(let i=0;i<N*N;i++)al[i]=d[i*4+3]/255}
  else{
    const lum=i=>(.299*d[i*4]+.587*d[i*4+1]+.114*d[i*4+2])/255;let bg=0,n=0;
    for(let k=0;k<N;k++)for(const i of [k,(N-1)*N+k,k*N,k*N+N-1]){bg+=lum(i);n++}
    const light=bg/n>.5;
    for(let i=0;i<N*N;i++){const L=lum(i),v=light?1-L:L;al[i]=Math.max(0,Math.min(1,(v-.05)/.9))}
  }
  /* dark filled middle (like a frame template): cut a round window */
  let cm=0,cn=0;for(let yy=0;yy<N;yy++)for(let xx=0;xx<N;xx++){if(Math.hypot(xx-N/2,yy-N/2)<N*.22){cm+=al[yy*N+xx];cn++}}
  if(cm/cn>.5)for(let yy=0;yy<N;yy++)for(let xx=0;xx<N;xx++){const t=Math.max(0,Math.min(1,(Math.hypot(xx-N/2,yy-N/2)/N-.28)/.05));al[yy*N+xx]*=t*t*(3-2*t)}
  /* inner radius: look from the middle outwards in 72 directions, take the lower quartile */
  const R=[];for(let a=0;a<72;a++){const dx=Math.cos(a*Math.PI/36),dy=Math.sin(a*Math.PI/36);let t=0;
    while(t<N/2){const px=Math.round(N/2+dx*t),py=Math.round(N/2+dy*t);if(px<0||py<0||px>=N||py>=N||al[py*N+px]>.35)break;t++}R.push(t)}
  R.sort((p,q)=>p-q);const rn=Math.max(.08,R[18]/N),k=Math.max(1.3,Math.min(2.1,.92/(2*rn)));
  for(let i=0;i<N*N;i++){if(!col){d[i*4]=d[i*4+1]=d[i*4+2]=0}d[i*4+3]=Math.round(al[i]*255)}
  x.putImageData(id,0,0);
  let url=c.toDataURL("image/webp",.8);if(!/^data:image\/webp/.test(url))url=c.toDataURL("image/png");
  return{url,k:+k.toFixed(2),col};
}

function buy(id){
  const CP=0;

  if(/^p[bf]\d/.test(id)){if(!S.prem){toast("Только для Premium");return}S.prof[id[1]==="b"?"banner":"frame"]=id;save();SFX.pop();Me();return}
  if(id==="fc"){

      S.coins-=CP;S.own.cframe=true;save();SFX.ok();confetti(60);toast("Куплено! Выбери свою картинку");Me();pickFrame();return}
    if(!S.prof.cframe||S.prof.frame==="fc"){pickFrame();return}
    S.prof.frame="fc";save();SFX.pop();Me();return}
  if(id==="bc"){

      S.coins-=CP;S.own.custom=true;save();SFX.ok();confetti(60);toast("Куплено! Выбери свою картинку");Me();pickBanner();return}
    if(!S.prof.custom||S.prof.banner==="bc"){pickBanner();return}
    S.prof.banner="bc";save();SFX.pop();Me();return}
  const isB=id[0]==="b",it=(isB?BANNERS:FRAMES).find(x=>x[0]===id),k=isB?"banner":"frame",own=isB?S.own.banners:S.own.frames,price=pp(isB?it[3]:it[2]);

}

    <div class="set"><span>🎵 Фоновая музыка</span><button class="sw${S.set.music?" on":""}" id="swM"></button></div>
    <div class="set"><span>Громкость музыки</span><input type="range" min="0" max="100" value="${S.set.mv*100}" id="vM"></div>

  </div>

  view.querySelector(".pedit").ontoggle=e=>{meOpen=e.target.open};

  $("#ph").onclick=()=>$("#phf").click();
  $("#phf").onchange=e=>{const f=e.target.files[0];if(!f)return;const im=new Image();
    im.onload=()=>{const c=document.createElement("canvas");c.width=c.height=160;const x=c.getContext("2d"),m=Math.min(im.width,im.height);x.drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,160,160);S.prof.photo=c.toDataURL("image/jpeg",.82);save();SFX.pop();Me()};

  $("#ff").onchange=e=>{
    const f=e.target.files[0];if(!f)return;
    if(f.size>20e6){toast("Файл слишком большой (до 20 МБ)");return}
    const im=new Image();
    im.onload=()=>{try{const r=frameFromImage(im);S.prof.cframe=r.url;S.prof.cframeK=r.k;S.prof.cframeCol=r.col?1:0;S.prof.frame="fc";save();SFX.ok();toast("Рамка установлена");Me()}catch(er){toast("Не получилось сделать рамку из этой картинки")}};
    im.onerror=()=>toast("Не получилось открыть картинку");
    im.src=URL.createObjectURL(f)};
  $("#bf").onchange=e=>{
    const f=e.target.files[0];if(!f)return;
    if(f.size>20e6){toast("Файл слишком большой (до 20 МБ)");return}
    const im=new Image();
    im.onload=()=>{
      const W=720,H=270,c=document.createElement("canvas");c.width=W;c.height=H;const x=c.getContext("2d"),r=Math.max(W/im.width,H/im.height),w=im.width*r,h=im.height*r;
      x.drawImage(im,(W-w)/2,(H-h)/2,w,h);
      const t=document.createElement("canvas");t.width=16;t.height=6;const tx=t.getContext("2d");tx.drawImage(c,0,0,16,6);
      const d=tx.getImageData(0,0,16,6).data;let L=0;for(let i=0;i<d.length;i+=4)L+=(.299*d[i]+.587*d[i+1]+.114*d[i+2])/255;L/=d.length/4;
      S.prof.custom=c.toDataURL("image/jpeg",.8);S.prof.customLight=L>.68?1:0;S.prof.banner="bc";save();SFX.ok();toast("Баннер установлен");Me()};

  $("#vR").onchange=()=>say("Hello, how are you?");
  view.querySelectorAll(".th").forEach(b=>b.onclick=()=>{S.theme=b.dataset.th;document.documentElement.dataset.theme=S.theme;save();SFX.pop();Me()});
  $("#rst").onclick=()=>{if(confirm("Сбросить весь прогресс?")){Object.assign(S,{known:[],bests:{},lessons:{},xp:0,streak:0,lastDay:"",today:{d:todayStr(),n:0},stats:{a:0,c:0},ach:[],seen:[],fav:[],mseen:[],mine:[],flags:{}});save();hud();Me()}};
}


/* ---- Premium: Telegram Stars, checked by the Cloudflare Worker ---- */
const PREM_URL="https://quiet-frog-ca80lingobloom-premium.donpedro180586.workers.dev",PREM_PRICE=100;
function cm(){return S.prem?2:1}
function pp(p){return S.prem?Math.round(p*.8):p}
function premInit(){try{return(window.Telegram&&Telegram.WebApp&&Telegram.WebApp.initData)||""}catch(e){return""}}
function freezeReady(){return !S.frz||Math.round((new Date(todayStr())-new Date(S.frz))/864e5)>=3}
async function premCall(path){
  const c=typeof AbortController!=="undefined"?new AbortController():null,tm=setTimeout(()=>{try{c&&c.abort()}catch(e){}},12000);
  try{const r=await fetch(PREM_URL+path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({initData:premInit()}),signal:c?c.signal:undefined});return await r.json()}
  finally{clearTimeout(tm)}
}
async function premCheck(){
  if(!premInit())return;
  try{const j=await premCall("/status");
    if(j&&typeof j.premium==="boolean"&&j.premium!==!!S.prem&&!(S.devPrem&&S.prem)){S.prem=j.premium;if(!S.prem&&/^(platinum|amethyst|ruby|midnight)$/.test(S.theme)){S.theme="royal";document.documentElement.dataset.theme="royal"}save();hud();if(tab==="me")Me()}}
  catch(e){}
}
async function premBuy(){
  if(!premInit()){toast("Premium покупается внутри Telegram");return}
  const T=Telegram.WebApp;
  try{
    const j=await premCall("/invoice");
    if(!j||!j.link){toast("Не получилось создать счёт. Попробуй позже");return}
    T.openInvoice(j.link,async st=>{
      if(st!=="paid"){if(st==="failed")toast("Оплата не прошла");return}
      toast("Проверяю оплату…");
      for(let i=0;i<8&&!S.prem;i++){await premCheck();if(S.prem)break;await new Promise(r=>setTimeout(r,1500))}
      if(S.prem){SFX.level();confetti(160);toast("👑 Premium активирован!");if(tab==="me")Me()}
      else toast("Платёж принят. Premium включится через минуту: зайди в Профиль ещё раз")
    });
  }catch(e){toast("Нет связи с сервером оплаты")}
}
const PBANNERS=[["pb1","Императорский","linear-gradient(135deg,#fff1b8,#d4a233 40%,#6b4a10 75%,#1a1205)"],["pb2","Аметист","linear-gradient(135deg,#d9c8f5,#8f6fcf 50%,#2a1b52)"],["pb3","Северное сияние","linear-gradient(135deg,#0b132b,#1b9aaa 45%,#6a4c93 80%,#0b132b)"],["pb4","Рубин","linear-gradient(135deg,#f4b9c3,#c14a5e 50%,#3a0f1a)"],["pb5","Полночь","radial-gradient(circle at 25% 35%,#fff 0 1px,transparent 2px),radial-gradient(circle at 78% 24%,#fff 0 1px,transparent 2px),linear-gradient(135deg,#1c2f66,#050a1f)"]];
const PFRAMES=[["pf1","Императорская"],["pf2","Аметистовая"],["pf3","Рубиновая"],["pf4","Неоновая"]];
function bannerOf(id){
  const x=S.prem&&PBANNERS.find(b=>b[0]===id);
  return x?[x[0],x[1],x[2],0,0]:(BANNERS.find(b=>b[0]===id)||BANNERS[0])
}
function premTiles(isB){
  const P=S.prof;
  return (isB?PBANNERS:PFRAMES).map(it=>{const id=it[0],eq=(isB?P.banner:P.frame)===id;
    return `<button class="si${eq?" on":""}" data-it="${id}"><div class="pv"${isB?` style="background:${it[2]}"`:""}>${isB?"":avatarHTML(46,id)}</div><b>${it[1]}</b><span>${eq?"✓ Надето":"👑 Premium · надеть"}</span></button>`}).join("")
}
function weekReady(){return !S.pwk||Math.round((new Date(todayStr())-new Date(S.pwk))/864e5)>=7}
function premWeekly(){
  if(!S.prem||!weekReady())return;
  S.pwk=todayStr();S.coins=(S.coins||0)+300;save();hud();SFX.level();confetti(120);toast("🎁 Королевский сундук: +300 🪙");Me()
}
function dailyBonus(){return 50+Math.min(S.streak||0,30)*5}
function premDaily(){
  const t=todayStr();if(!S.prem||S.pdb===t)return;

}

  return `<div class="card" style="border-color:rgba(200,169,106,.55)"><b>👑 Premium</b>
    <div class="muted" style="margin:10px 0;line-height:1.7">${perks}</div>

    ${premInit()?"":'<div class="note">Покупка доступна, когда сайт открыт внутри Telegram.</div>'}</div>`
}
function bindPrem(){const b=$("#pbuy");if(b)b.onclick=()=>{SFX.pop();premBuy()};const d=$("#pdb");if(d)d.onclick=premDaily;const w=$("#pwk");if(w)w.onclick=premWeekly}

hud();render();premCheck();
new MutationObserver(()=>{view.classList.remove("pgin");void view.offsetWidth;view.classList.add("pgin")}).observe(view,{childList:true});
{let n=0,t0=0;document.querySelector(".logo").addEventListener("click",()=>{const now=Date.now();n=now-t0>3000?1:n+1;t0=now;if(n>=7){n=0;tab="admin";redraw=null;SFX.pop();render()}})}
