<!DOCTYPE html>
<html lang="ru" data-theme="royal">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Learn English</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#0a0c16;--text:#f1f2f8;--muted:#9aa1bd;--line:rgba(255,255,255,.1);--glass:rgba(255,255,255,.06);--ok:#34d399;--bad:#fb7185;--a:#8b7cff;--a2:#5b8cff;--g:#e9c46a}
[data-theme=emerald]{--a:#2dd4a0;--a2:#22a6c9;--g:#f5d98b}
[data-theme=rose]{--a:#fb7185;--a2:#c06cf0;--g:#fcd5a5}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:0 0 110px;min-height:100vh;overflow-x:hidden}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;background:radial-gradient(1200px 700px at 50% -10%,#1a1d3a,var(--bg))}
.bg i{position:absolute;border-radius:50%;filter:blur(80px);opacity:.35;animation:fl 18s ease-in-out infinite alternate}
.bg i:nth-child(1){width:340px;height:340px;background:var(--a);top:-80px;left:-90px}
.bg i:nth-child(2){width:300px;height:300px;background:var(--g);bottom:60px;right:-100px;animation-duration:24s;opacity:.18}
.bg i:nth-child(3){width:260px;height:260px;background:var(--a2);top:45%;left:-110px;animation-duration:21s;opacity:.22}
@keyframes fl{to{transform:translate(60px,-50px) scale(1.2)}}
#cf{position:fixed;inset:0;pointer-events:none;z-index:50}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(12px + env(safe-area-inset-top)) 16px 10px;background:linear-gradient(var(--bg) 60%,transparent);backdrop-filter:blur(10px)}
.logo{font-family:Georgia,"Times New Roman",serif;font-size:21px;font-weight:700;letter-spacing:.3px;background:linear-gradient(90deg,var(--g),#fff 60%,var(--g));-webkit-background-clip:text;background-clip:text;color:transparent}
.hud{display:flex;gap:6px;align-items:center}
.pill{background:var(--glass);border:1px solid var(--line);border-radius:20px;padding:6px 10px;font-size:13px;font-weight:600;backdrop-filter:blur(10px);white-space:nowrap}
.pill.gold{color:var(--g)}
.mbtn{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--glass);color:var(--text);font-size:16px;cursor:pointer;padding:0}
main{padding:6px 16px;max-width:560px;margin:0 auto;animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
h2{font-family:Georgia,serif;font-size:20px;margin:22px 0 8px}
.muted{color:var(--muted);font-size:13px}
.card{background:var(--glass);border:1px solid var(--line);border-radius:20px;padding:16px;margin:12px 0;backdrop-filter:blur(14px);box-shadow:0 8px 30px rgba(0,0,0,.25)}
.hero{background:linear-gradient(135deg,rgba(139,124,255,.25),rgba(233,196,106,.12));border-color:rgba(233,196,106,.3)}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.center{text-align:center}
.en{font-family:Georgia,serif;font-size:40px;font-weight:700;margin:8px 0;background:linear-gradient(180deg,#fff,var(--g));-webkit-background-clip:text;background-clip:text;color:transparent;overflow-wrap:anywhere}
.en2{font-family:Georgia,serif;font-size:28px;font-weight:700;margin:6px 0;overflow-wrap:anywhere}
.btn{border:0;background:linear-gradient(135deg,var(--a),var(--a2));color:#fff;padding:13px 18px;border-radius:14px;font-size:15px;font-weight:600;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.3);transition:transform .12s}
.btn:active{transform:scale(.96)}
.btn.ghost{background:var(--glass);border:1px solid var(--line);box-shadow:none}
.btn.ok{background:linear-gradient(135deg,#34d399,#12a37a)}
.btn.bad{background:linear-gradient(135deg,#fb7185,#d63e5c)}
.btn.gold{background:linear-gradient(135deg,var(--g),#c99a3a);color:#2a1d00}
.row{display:flex;gap:10px;margin-top:12px}.row .btn{flex:1}
.icon{border:1px solid var(--line);background:var(--glass);color:var(--text);width:44px;height:44px;border-radius:50%;font-size:18px;cursor:pointer}
.back{border:0;background:none;color:var(--muted);font-size:14px;cursor:pointer;padding:6px 0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--glass);color:var(--text);padding:8px 14px;border-radius:20px;font-size:14px;cursor:pointer}
.chip.on{background:linear-gradient(135deg,var(--a),var(--a2));border-color:transparent;font-weight:600}
.search{width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--glass);color:var(--text);font-size:15px;outline:none;margin:6px 0}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px}
.letter{background:var(--glass);border:1px solid var(--line);border-radius:16px;padding:14px 0 10px;text-align:center;font-family:Georgia,serif;font-size:28px;font-weight:700;cursor:pointer;transition:transform .12s,border-color .2s}
.letter small{display:block;font-family:system-ui;font-size:11px;font-weight:400;color:var(--muted);margin-top:2px}
.letter:active{transform:scale(.93)}
.letter.seen{border-color:rgba(233,196,106,.5)}
.word{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px}
.word b{font-family:Georgia,serif;font-size:20px}
.word .acts{display:flex;gap:6px}
.star{color:var(--muted)}.star.on{color:var(--g)}
.bar{height:8px;background:rgba(255,255,255,.1);border-radius:6px;overflow:hidden;margin:8px 0}
.bar div{height:100%;background:linear-gradient(90deg,var(--a),var(--g));border-radius:6px;transition:width .5s}
.ring{--p:0;width:92px;height:92px;border-radius:50%;background:conic-gradient(var(--g) calc(var(--p)*1%),rgba(255,255,255,.1) 0);display:grid;place-items:center;flex:none}
.ring>div{width:74px;height:74px;border-radius:50%;background:#12152a;display:grid;place-items:center;text-align:center;font-weight:700;font-size:18px;line-height:1.1}
.ring small{display:block;font-size:10px;font-weight:400;color:var(--muted)}
.games{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.game{background:var(--glass);border:1px solid var(--line);border-radius:20px;padding:16px;cursor:pointer;text-align:left;color:var(--text);transition:transform .15s,border-color .2s}
.game:active{transform:scale(.96)}
.game:hover{border-color:var(--g)}
.game .e{font-size:30px}.game b{display:block;margin:8px 0 2px;font-size:16px}
.game span{font-size:12px;color:var(--muted)}
.opt{display:block;width:100%;text-align:left;margin:9px 0;padding:15px;border-radius:14px;border:1px solid var(--line);background:var(--glass);color:var(--text);font-size:16px;cursor:pointer;transition:transform .12s,background .2s}
.opt:active{transform:scale(.98)}
.opt.ok{background:linear-gradient(135deg,#34d399,#12a37a);border-color:transparent;animation:pop .4s}
.opt.bad{background:linear-gradient(135deg,#fb7185,#d63e5c);border-color:transparent;animation:shake .4s}
@keyframes pop{50%{transform:scale(1.04)}}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.shake{animation:shake .4s}
.prompt{padding:24px 16px}
.combo{color:var(--g);font-weight:700;font-size:14px}
.fc{perspective:900px;height:230px;margin:14px 0;cursor:pointer}
.fc .in{position:relative;height:100%;transition:transform .6s cubic-bezier(.3,1.2,.4,1);transform-style:preserve-3d}
.fc.f .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:22px;border:1px solid rgba(233,196,106,.35);background:linear-gradient(145deg,rgba(139,124,255,.22),rgba(255,255,255,.05));display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:16px;box-shadow:0 10px 40px rgba(0,0,0,.35)}
.face.back{transform:rotateY(180deg);background:linear-gradient(145deg,rgba(233,196,106,.2),rgba(255,255,255,.05))}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.m{padding:16px 8px;border-radius:14px;border:1px solid var(--line);background:var(--glass);color:var(--text);font-size:15px;cursor:pointer;min-height:56px;transition:all .2s}
.m.sel{border-color:var(--g);background:rgba(233,196,106,.18);transform:scale(1.03)}
.m.done{opacity:.35;background:rgba(52,211,153,.25);border-color:var(--ok);pointer-events:none}
.m.bad{background:rgba(251,113,133,.35);border-color:var(--bad);animation:shake .4s}
.slots,.tiles{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:14px 0}
.slot,.tile{width:44px;height:54px;border-radius:12px;font-family:Georgia,serif;font-size:24px;font-weight:700;color:var(--text);cursor:pointer}
.slot{border:2px dashed var(--line);background:transparent}
.slot.f{border:2px solid var(--g);background:rgba(233,196,106,.12)}
.slot.okk{border-color:var(--ok);background:rgba(52,211,153,.25)}
.tile{border:1px solid var(--line);background:var(--glass);box-shadow:0 4px 12px rgba(0,0,0,.3)}
.tile.used{opacity:.15}
.big{font-family:Georgia,serif;font-size:56px;font-weight:800}
.stars{font-size:34px;letter-spacing:4px;margin:6px 0}
.ach{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.a{background:var(--glass);border:1px solid var(--line);border-radius:16px;padding:12px 6px;text-align:center;font-size:11px;color:var(--muted)}
.a .e{font-size:28px;filter:grayscale(1);opacity:.35}
.a.on{border-color:rgba(233,196,106,.5);color:var(--text)}
.a.on .e{filter:none;opacity:1}
.set{display:flex;justify-content:space-between;align-items:center;padding:10px 0;gap:12px}
.set input[type=range]{width:50%;accent-color:var(--g)}
.sw{position:relative;width:48px;height:28px;border-radius:16px;background:rgba(255,255,255,.15);border:0;cursor:pointer;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.25s}
.sw.on{background:linear-gradient(135deg,var(--a),var(--a2))}.sw.on::after{left:23px}
.themes{display:flex;gap:10px}
.th{width:38px;height:38px;border-radius:50%;border:2px solid transparent;cursor:pointer}
.th.on{border-color:#fff}
#toast{position:fixed;top:calc(64px + env(safe-area-inset-top));left:50%;transform:translate(-50%,-30px);opacity:0;z-index:60;background:rgba(20,22,44,.95);border:1px solid var(--g);border-radius:16px;padding:12px 18px;font-size:14px;font-weight:600;transition:.35s;pointer-events:none;max-width:90%;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.5)}
#toast.show{opacity:1;transform:translate(-50%,0)}
nav{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:30;display:flex;gap:2px;padding:6px;background:rgba(20,22,44,.8);border:1px solid var(--line);border-radius:26px;backdrop-filter:blur(20px);box-shadow:0 10px 40px rgba(0,0,0,.5);width:calc(100% - 28px);max-width:440px}
nav button{flex:1;border:0;background:none;color:var(--muted);padding:8px 1px;font-size:10px;cursor:pointer;border-radius:20px;transition:.25s}
nav button span{display:block;font-size:18px;margin-bottom:1px}
nav button.on{color:#fff;background:linear-gradient(135deg,var(--a),var(--a2));font-weight:600}
.lesson{display:flex;align-items:center;gap:14px;width:100%;text-align:left;margin:10px 0;padding:14px;border-radius:18px;border:1px solid var(--line);background:var(--glass);color:var(--text);cursor:pointer;backdrop-filter:blur(14px);transition:transform .12s}
.lesson:active{transform:scale(.98)}
.lesson .le{font-size:26px;width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:rgba(255,255,255,.07);flex:none;font-family:Georgia,serif;font-weight:700}
.lesson .lt{flex:1}.lesson .lt b{display:block;font-size:16px}.lesson .lt span{font-size:12px;color:var(--muted)}
.lesson .ls{font-size:14px;color:var(--g)}
.lesson.cur{border-color:var(--g);animation:glow 2s infinite alternate}
@keyframes glow{from{box-shadow:0 0 10px rgba(233,196,106,.1)}to{box-shadow:0 0 30px rgba(233,196,106,.45)}}
.lesson.done .le{background:rgba(52,211,153,.2)}
.lesson.lock{opacity:.5}
.ex{margin-top:14px;padding:12px;border-radius:14px;background:rgba(255,255,255,.06);border:1px dashed var(--line)}
.tip{background:rgba(233,196,106,.1);border:1px solid rgba(233,196,106,.35);border-radius:16px;padding:12px 14px;font-size:14px;margin:10px 0;line-height:1.4}
.note{font-size:12px;color:var(--muted);text-align:center;margin:8px 0;line-height:1.4}
</style>
</head>

</nav>

<script>
try{if(window.Telegram&&Telegram.WebApp){Telegram.WebApp.ready();Telegram.WebApp.expand();try{Telegram.WebApp.setHeaderColor("#0a0c16");Telegram.WebApp.setBackgroundColor("#0a0c16")}catch(e){}}}catch(e){}

/* ================= DATA ================= */
const D=JSON.parse(document.getElementById("data").textContent);
const ALPHA=D.alpha,TOPICS=D.topics,EX=D.examples;
const ALL=[];for(const t in TOPICS)TOPICS[t].words.forEach(w=>ALL.push({en:w[0],tr:w[1],ru:w[2],topic:t}));
const WORD=Object.fromEntries(ALL.map(w=>[w.en,w]));

/* ================= STATE ================= */
const $=s=>document.querySelector(s);
const todayStr=()=>new Date().toLocaleDateString("sv");
const yestStr=()=>new Date(Date.now()-864e5).toLocaleDateString("sv");
function load(){try{return JSON.parse(localStorage.getItem("le1")||"{}")}catch(e){return {}}}
const L0=load();
const S=Object.assign({known:[],bests:{},lessons:{},xp:0,streak:0,lastDay:"",today:{d:"",n:0},stats:{a:0,c:0},ach:[],seen:[],fav:[],flags:{},theme:"royal"},L0);
S.set=Object.assign({music:true,sfx:true,mv:.6,sv:.8,rate:.9},L0.set||{});
function save(){try{localStorage.setItem("le1",JSON.stringify(S))}catch(e){}}
if(S.today.d!==todayStr())S.today={d:todayStr(),n:0};
document.documentElement.dataset.theme=S.theme;
const level=()=>Math.floor(S.xp/100)+1;
function touchDay(){
  const t=todayStr();
  if(S.today.d!==t)S.today={d:t,n:0};
  if(S.lastDay!==t){S.streak=(S.lastDay===yestStr())?S.streak+1:1;S.lastDay=t;}
}

/* ================= AUDIO: music & effects ================= */
const AU={ctx:null,timer:null,ci:0,next:0};
const mf=m=>440*Math.pow(2,(m-69)/12);
function initAudio(){
  if(AU.ctx){if(AU.ctx.state==="suspended")AU.ctx.resume();return}
  const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
  const c=AU.ctx=new C();
  AU.master=c.createGain();AU.master.connect(c.destination);
  AU.mus=c.createGain();AU.sfx=c.createGain();
  const conv=c.createConvolver(),len=c.sampleRate*3,buf=c.createBuffer(2,len,c.sampleRate);
  for(let ch=0;ch<2;ch++){const d=buf.getChannelData(ch);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6)}
  conv.buffer=buf;
  const wet=c.createGain();wet.gain.value=.55;conv.connect(wet);wet.connect(AU.master);
  const sw=c.createGain();sw.gain.value=.3;
  AU.mus.connect(AU.master);AU.mus.connect(conv);
  AU.sfx.connect(AU.master);AU.sfx.connect(sw);sw.connect(conv);
  applyVol();
}
function applyVol(){
  if(!AU.ctx)return;const t=AU.ctx.currentTime;
  AU.mus.gain.setTargetAtTime(S.set.music?S.set.mv*.55:0,t,.3);
  AU.sfx.gain.setTargetAtTime(S.set.sfx?S.set.sv:0,t,.05);
}
function note(f,t,d,type,v,dest,att){
  const c=AU.ctx,o=c.createOscillator(),g=c.createGain();
  o.type=type;o.frequency.value=f;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+(att||.01));g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(dest);o.start(t);o.stop(t+d+.05);
}
const CH=[[45,57,60,64],[41,53,57,60],[48,55,60,64],[43,55,59,62]];
function schedChord(t){
  const c=AU.ctx,ch=CH[AU.ci%4],f=c.createBiquadFilter();
  f.type="lowpass";f.frequency.value=1100;f.connect(AU.mus);
  ch.forEach((m,k)=>{
    const v=k===0?.10:.05;
    note(mf(m),t,8.5,"sine",v,f,2.2);
    note(mf(m)*1.004,t,8.5,"triangle",v*.5,f,2.6);
  });
  for(let k=0;k<16;k++){
    if(Math.random()<.68){
      const m=ch[1+(Math.random()*3|0)]+12*(1+(Math.random()*2|0));
      note(mf(m),t+k*.5+(Math.random()*.04),1.8,"sine",.045,AU.mus,.006);
    }
  }
  AU.ci++;
}
function startMusic(){
  if(!AU.ctx||AU.timer)return;
  AU.next=AU.ctx.currentTime+.15;
  const tick=()=>{while(AU.next<AU.ctx.currentTime+1.5){schedChord(AU.next);AU.next+=8}};
  tick();AU.timer=setInterval(tick,500);
}
function stopMusic(){if(AU.timer){clearInterval(AU.timer);AU.timer=null}}
function setMusic(on){
  S.set.music=on;save();initAudio();
  if(on)startMusic();else stopMusic();
  applyVol();$("#hMusic").textContent=on?"🎵":"🔇";
}
function tone(f,d,type,v,delay,slide){
  if(!AU.ctx||!S.set.sfx)return;
  const c=AU.ctx,t=c.currentTime+(delay||0),o=c.createOscillator(),g=c.createGain();
  o.type=type||"sine";o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(f*slide,t+d);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(AU.sfx);o.start(t);o.stop(t+d+.05);
}
function bell(f,delay,v){tone(f,.7,"sine",v||.22,delay);tone(f*2,.4,"sine",(v||.22)*.35,delay);tone(f*3,.25,"sine",(v||.22)*.15,delay)}
const SFX={
  tap(){tone(720,.07,"triangle",.25,0,1.35)},
  pop(){tone(500,.1,"sine",.3,0,1.8)},
  flip(){tone(300,.15,"triangle",.22,0,2.2);tone(600,.1,"sine",.12,.08)},
  ok(){[523,659,784,1047].forEach((f,i)=>bell(f,i*.07,.2))},
  bad(){tone(240,.35,"triangle",.28,0,.55);tone(180,.4,"sine",.2,.1,.6)},
  coin(){tone(1319,.09,"square",.07);tone(1760,.3,"square",.07,.08)},
  level(){[523,659,784,1047,1319,1568].forEach((f,i)=>bell(f,i*.11,.22))},
  ach(){bell(880,0,.22);bell(1175,.15,.22);bell(1760,.3,.2)},
  letter(i){bell(mf(60+[0,2,4,7,9][i%5]+12*((i/5|0)%2)),0,.2)}
};
function silentLoop(){
  if(AU.sil)return;
  try{
    const n=800,b=new ArrayBuffer(44+n*2),v=new DataView(b),w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};
    w(0,"RIFF");v.setUint32(4,36+n*2,true);w(8,"WAVE");w(12,"fmt ");v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
    v.setUint32(24,8000,true);v.setUint32(28,16000,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,"data");v.setUint32(40,n*2,true);
    const a=new Audio(URL.createObjectURL(new Blob([b],{type:"audio/wav"})));a.loop=true;a.volume=.02;AU.sil=a;a.play().catch(()=>{AU.sil=null});
  }catch(e){}
}
function unlockAudio(){
  try{if(navigator.audioSession)navigator.audioSession.type="playback"}catch(e){}
  initAudio();
  if(AU.ctx){
    if(AU.ctx.state!=="running")AU.ctx.resume();
    if(!AU.unlocked){try{const s=AU.ctx.createBufferSource();s.buffer=AU.ctx.createBuffer(1,1,22050);s.connect(AU.ctx.destination);s.start(0);AU.unlocked=true}catch(e){}}
  }
  silentLoop();
  if(S.set.music)startMusic();
}
["pointerdown","touchend","click","keydown"].forEach(ev=>document.addEventListener(ev,unlockAudio,{passive:true}));
document.addEventListener("visibilitychange",()=>{if(!AU.ctx)return;document.hidden?AU.ctx.suspend():AU.ctx.resume()});

/* ================= AUDIO: speech (pre-recorded mp3 first) ================= */
let enVoice=null;
function pickVoice(){try{const v=speechSynthesis.getVoices().filter(x=>/^en/i.test(x.lang));enVoice=v.find(x=>/en[-_]US/i.test(x.lang)&&/google|samantha|enhanced|premium|natural/i.test(x.name))||v.find(x=>/en[-_]US/i.test(x.lang))||v[0]||null}catch(e){}}
try{pickVoice();speechSynthesis.onvoiceschanged=pickVoice}catch(e){}
function hasEnVoice(){try{return speechSynthesis.getVoices().some(x=>/^en/i.test(x.lang))}catch(e){return false}}
function voiceNote(){
  try{const vs=speechSynthesis.getVoices();if(!vs.length||vs.some(x=>/^en/i.test(x.lang)))return""}catch(e){}
  return '<div class="note">ℹ️ На этом устройстве нет английского голоса, поэтому слова воспроизводятся из записанных файлов или онлайн-голоса (нужен интернет).</div>';
}
const TTS=[
  t=>"https://api.streamelements.com/kappa/v2/speech?voice=Brian&text="+encodeURIComponent(t),
  t=>"https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=en&q="+encodeURIComponent(t),
  t=>"https://translate.googleapis.com/translate_tts?ie=UTF-8&client=gtx&tl=en&q="+encodeURIComponent(t)
];
function nativeSay(text,slow){
  try{
    const u=new SpeechSynthesisUtterance(text);u.lang="en-US";u.rate=(S.set.rate||.9)*(slow?.6:1);if(enVoice)u.voice=enVoice;
    speechSynthesis.cancel();speechSynthesis.resume();speechSynthesis.speak(u);return true;
  }catch(e){return false}
}
function cloudSay(text,slow,i){
  i=i||0;const my=AU.sayId;
  if(i>=TTS.length){
    if(my===AU.sayId){nativeSay(text,slow);if(!AU.warned){AU.warned=1;toast("🔇 Не удалось загрузить голос. Проверьте интернет.")}}
    return;
  }
  try{
    if(AU.tts)AU.tts.pause();
    const a=new Audio();a.preload="auto";a.src=TTS[i](text);a.playbackRate=slow?.7:1;AU.tts=a;
    let failed=false;const fail=()=>{if(failed||my!==AU.sayId)return;failed=true;cloudSay(text,slow,i+1)};
    a.onerror=fail;
    const p=a.play();
    if(p&&p.catch)p.catch(e=>{if(e&&e.name==="NotAllowedError"){if(!AU.warned2){AU.warned2=1;toast("🔊 Нажмите на кнопку динамика, чтобы услышать слово")}}else fail()});
  }catch(e){cloudSay(text,slow,i+1)}
}
/* Pre-recorded files: audio/<hash>.mp3 (made by scripts/generate_audio.py) */
function h32(s){let h=0x811c9dc5;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0}return h.toString(16).padStart(8,"0")}
function fileSay(text,slow,onFail){
  try{
    if(AU.tts)AU.tts.pause();
    const a=new Audio("audio/"+h32(text)+".mp3");a.preload="auto";a.playbackRate=slow?.7:1;AU.tts=a;
    let f=false;const fail=()=>{if(!f){f=true;onFail()}};
    a.onerror=fail;
    const p=a.play();
    if(p&&p.catch)p.catch(e=>{if(e&&e.name==="NotAllowedError"){if(!AU.warned2){AU.warned2=1;toast("🔊 Нажмите на кнопку динамика, чтобы услышать слово")}}else fail()});
  }catch(e){onFail()}
}
function say(text,slow){
  const my=AU.sayId=(AU.sayId||0)+1;
  try{speechSynthesis.cancel()}catch(e){}
  fileSay(text,slow,()=>{if(my===AU.sayId)sayFallback(text,slow,my)});
}
function sayFallback(text,slow,my){
  let native=false;
  try{native=("speechSynthesis" in window)&&typeof SpeechSynthesisUtterance!=="undefined"}catch(e){}
  try{if(AU.tts)AU.tts.pause()}catch(e){}
  if(!native)return cloudSay(text,slow);
  let n=0;try{n=speechSynthesis.getVoices().length}catch(e){}
  if(!n||!hasEnVoice())return cloudSay(text,slow);
  try{
    const u=new SpeechSynthesisUtterance(text);u.lang="en-US";u.rate=(S.set.rate||.9)*(slow?.6:1);if(enVoice)u.voice=enVoice;
    let started=false;u.onstart=()=>{started=true};
    u.onerror=e=>{if(!started&&my===AU.sayId&&e.error!=="canceled"&&e.error!=="interrupted")cloudSay(text,slow)};
    speechSynthesis.cancel();speechSynthesis.resume();speechSynthesis.speak(u);
    setTimeout(()=>{if(!started&&my===AU.sayId&&!speechSynthesis.speaking)cloudSay(text,slow)},1500);
  }catch(e){cloudSay(text,slow)}
}
function soundTest(){
  unlockAudio();SFX.ok();setTimeout(()=>say("Hello, how are you?"),700);
  let nat="speechSynthesis" in window,n=0;try{n=speechSynthesis.getVoices().filter(x=>/^en/i.test(x.lang)).length}catch(e){}
  const st=AU.ctx?AU.ctx.state:"недоступно";
  setTimeout(()=>{fetch("audio/"+h32("Hello, how are you?")+".mp3",{method:"HEAD"}).then(r=>{const e=$("#fchk");if(e)e.textContent=r.ok?"найдены ✓":"не найдены (запустите генератор озвучки)"}).catch(()=>{const e=$("#fchk");if(e)e.textContent="недоступны"})},50);
  $("#diag").innerHTML="Звуковой движок: <b>"+st+"</b> · Синтез речи: <b>"+(nat?"есть":"нет")+"</b> · Английских голосов: <b>"+n+"</b><br>Файлы озвучки слов: <b id='fchk'>проверка…</b><br>Нет звука? Увеличьте громкость мультимедиа, выключите беззвучный режим (на iPhone — боковой переключатель) и коснитесь экрана.";
}
function buzz(kind){
  try{const H=Telegram.WebApp.HapticFeedback;if(kind==="error")H.notificationOccurred("error");else H.impactOccurred("light");return}catch(e){}
  try{navigator.vibrate&&navigator.vibrate(kind==="error"?80:15)}catch(e){}
}

/* ================= FX / HUD ================= */
let toastT;
function toast(msg){const t=$("#toast");t.innerHTML=msg;t.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("show"),2600)}
function confetti(n){
  n=n||110;const c=$("#cf"),x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;
  const cols=["#e9c46a","#8b7cff","#5eead4","#fb7185","#ffffff"];
  const P=Array.from({length:n},()=>({x:innerWidth/2,y:innerHeight*.4,vx:(Math.random()-.5)*15,vy:-Math.random()*14-3,s:Math.random()*8+4,c:cols[Math.random()*5|0],r:Math.random()*6,vr:(Math.random()-.5)*.4,l:1}));
  (function f(){
    x.clearRect(0,0,c.width,c.height);let alive=0;
    P.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.l-=.007;
      if(p.l>0&&p.y<c.height){alive++;x.save();x.globalAlpha=p.l;x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()}});
    if(alive)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height);
  })();
}
function hud(){
  $("#hStreak").textContent="🔥 "+S.streak;

function gainXP(n){

const LESSONS=D.lessons;
const ACH=[
 ["first","🌱","Первый шаг","Ответьте на вопрос",()=>S.stats.a>=1],

/* ================= UI CORE ================= */

/* ---- generic multiple choice ---- */
function choiceGame(id,title,items,make){
  let i=0,score=0,combo=0,locked=false;const n=items.length;
  function step(){
    if(i>=n)return finish(id,title,score,n);
    const q=make(items[i]);
    view.innerHTML=`<button class="back" id="bk">← Игры</button>
    <div class="between"><span class="muted">${title} · ${i+1}/${n}</span><span class="combo">${combo>1?"🔥 комбо x"+combo:""}</span></div>
    <div class="bar"><div style="width:${i/n*100}%"></div></div>
    <div class="card center prompt">${q.prompt}${q.say?'<button class="icon" id="sp" style="margin-top:8px">🔊</button>':''}</div>
    <div>${q.opts.map((o,k)=>`<button class="opt" data-k="${k}">${o.t}</button>`).join("")}</div>`;
    $("#bk").onclick=Play;
    if(q.say){$("#sp").onclick=()=>say(q.say);if(q.auto)later(()=>say(q.say),350)}
    locked=false;
    const btns=view.querySelectorAll(".opt");
    btns.forEach(b=>b.onclick=()=>{
      if(locked)return;locked=true;
      const o=q.opts[b.dataset.k];
      if(o.ok){b.classList.add("ok");score++;combo++;answer(true);if(combo>=3){gainXP(combo>=5?5:2);SFX.coin()}}
      else{b.classList.add("bad");combo=0;answer(false);btns.forEach((x,k)=>{if(q.opts[k].ok)x.classList.add("ok")})}
      later(()=>{i++;step()},1000);
    });
  }
  step();
}
function finish(id,title,score,max){
  const ratio=score/max;
  if(S.bests[id]==null||score>S.bests[id])S.bests[id]=score;
  if(score===max)S.flags.perfect=1;
  const bonus=score*3;gainXP(bonus);
  if(ratio>=.8){SFX.level();confetti()}
  save();checkAch();
  const st=ratio>=.9?3:ratio>=.6?2:ratio>=.3?1:0;
  view.innerHTML=`<div class="card center hero" style="padding:28px 16px">
    <div class="muted">${title}</div>
    <div class="stars">${"⭐".repeat(st)}${"☆".repeat(3-st)}</div>
    <div class="big">${score}/${max}</div>
    <div class="muted" style="margin-top:6px">${ratio>=.8?"Отлично! Excellent! 🎉":ratio>=.5?"Неплохо, продолжайте 👍":"Повторите слова и попробуйте снова 💪"}</div>
    <div class="muted" style="margin-top:6px">Бонус +${bonus} XP</div></div>
    <div class="row"><button class="btn" id="again">Ещё раз</button><button class="btn ghost" id="menu">Игры</button></div>`;
  $("#again").onclick=()=>startGame(id);$("#menu").onclick=Play;
}

function matchGame(){
  const ws=shuffle(ALL).slice(0,6),Lw=shuffle(ws.map((w,i)=>i)),Rw=shuffle(ws.map((w,i)=>i));
  let done=0,miss=0,sL=null,sR=null;

  <div class="mgrid">${Lw.map((id,k)=>`<button class="m" data-s="l" data-id="${id}">${ws[id].en}</button><button class="m" data-s="r" data-id="${Rw[k]}">${ws[Rw[k]].ru}</button>`).join("")}</div>`;

    el.classList.add("sel");if(side==="l"){sL=el;say(ws[el.dataset.id].en)}else sR=el;
    if(sL&&sR){
      const a=sL,b=sR;sL=sR=null;

        answer(true);done++;if(done===6)later(()=>finish("match","Найди пару",Math.max(0,6-miss),6),800);
      }else{
        a.classList.add("bad");b.classList.add("bad");miss++;answer(false);
        setTimeout(()=>{a.classList.remove("bad","sel");b.classList.remove("bad","sel")},500);
      }
    }
  });
}

/* ---- word builder ---- */
function buildGame(){
  const pool=shuffle(ALL.filter(w=>/^[a-z]{3,}$/i.test(w.en))).slice(0,6);
  let r=0,score=0;
  function round(){
    if(r>=pool.length)return finish("build","Собери слово",score,pool.length);
    const w=pool[r],word=w.en.toLowerCase();
    let letters=shuffle(word.split(""));
    if(letters.join("")===word)letters.reverse();
    let slots=Array(word.length).fill(null),failed=false,locked=false;
    function draw(){
      view.innerHTML=`<button class="back" id="bk">← Игры</button>
      <div class="between"><span class="muted">Собери слово · ${r+1}/${pool.length}</span></div>
      <div class="bar"><div style="width:${r/pool.length*100}%"></div></div>
      <div class="card center"><div class="muted">Напишите это слово по-английски</div><div class="en2">${w.ru}</div><div class="muted">[${w.tr}]</div>
      <button class="icon" id="sp" style="margin-top:8px">🔊</button></div>
      <div class="slots" id="sl">${slots.map((s,k)=>`<button class="slot${s!==null?" f":""}" data-k="${k}">${s!==null?letters[s].toUpperCase():""}</button>`).join("")}</div>
      <div class="tiles">${letters.map((l,k)=>slots.includes(k)?`<button class="tile used" disabled>${l.toUpperCase()}</button>`:`<button class="tile" data-k="${k}">${l.toUpperCase()}</button>`).join("")}</div>`;
      $("#bk").onclick=Play;$("#sp").onclick=()=>say(w.en);
      view.querySelectorAll(".tile:not(.used)").forEach(t=>t.onclick=()=>{
        if(locked)return;const e=slots.indexOf(null);if(e<0)return;
        slots[e]=+t.dataset.k;SFX.pop();draw();
        if(!slots.includes(null))check();
      });
      view.querySelectorAll(".slot").forEach(s=>s.onclick=()=>{
        if(locked)return;if(slots[s.dataset.k]!==null){slots[s.dataset.k]=null;SFX.tap();draw()}
      });
    }
    function check(){
      locked=true;
      const built=slots.map(s=>letters[s]).join("");
      if(built===word){
        view.querySelectorAll(".slot").forEach(s=>s.classList.add("okk"));
        answer(true);say(w.en);if(!failed)score++;
        later(()=>{r++;round()},1100);
      }else{
        failed=true;answer(false);$("#sl").classList.add("shake");
        later(()=>{slots=Array(word.length).fill(null);locked=false;draw()},600);
      }
    }
    draw();
  }
  round();
}

function startPractice(){

  LS.n=LS.items.length;LS.right=0;LS.done=0;LS.combo=0;

function lessonQ(cur){
  const it=cur.it,t=cur.type,others=LS.items.filter(x=>x!==it);
  const pick3=(arr,ex)=>[...new Set(arr)].filter(x=>x!==ex).slice(0,3);
  const mk=(good,bad)=>shuffle([{t:good,ok:1},...bad.map(x=>({t:x}))]);
  if(t==="tr")return{prompt:`<div class="muted">Что это значит?</div><div class="en">${it.en}</div><div class="muted">[${it.tr}]</div>`,say:it.en,after:it.en,
    opts:mk(it.ru,pick3([...shuffle(others.map(x=>x.ru)),...shuffle(ALL.map(x=>x.ru))],it.ru))};
  if(t==="listen")return{prompt:`<div class="muted">Послушайте и выберите слово</div><div style="font-size:50px;margin:6px 0">🎧</div>`,say:it.en,auto:1,
    opts:mk(it.en,pick3([...shuffle(others.map(x=>x.en)),...shuffle(ALL.map(x=>x.en))],it.en))};
  if(t==="rev")return{prompt:`<div class="muted">Как сказать по-английски…</div><div class="en2">${it.ru}</div>`,after:it.en,
    opts:mk(it.en,pick3([...shuffle(others.map(x=>x.en)),...shuffle(ALL.map(x=>x.en))],it.en))};
  if(t==="snd")return{prompt:`<div class="muted">Как называется эта буква?</div><div class="en" style="font-size:68px">${it.ch}</div>`,say:it.say,
    opts:mk(it.snd,pick3([...shuffle(others.map(x=>x.snd)),...shuffle(ALPHA.map(a=>a[1]))],it.snd))};
  return{prompt:`<div class="muted">Какую букву вы слышите?</div><div style="font-size:50px;margin:6px 0">🎧</div>`,say:it.say,auto:1,
    opts:mk(it.ch,pick3([...shuffle(others.map(x=>x.ch)),...shuffle(ALPHA.map(a=>a[0]))],it.ch))};
}
function practiceStep(){
  if(!LS.q.length)return lessonEnd();
  const cur=LS.q.shift(),q=lessonQ(cur),l=LESSONS[LS.i];let locked=false;
  view.innerHTML=`<button class="back" id="bk">← Уроки</button>
  <div class="between"><span class="muted">${l.t} · Практика</span><span class="combo">${LS.combo>1?"🔥 x"+LS.combo:""}</span></div>
  <div class="bar"><div style="width:${LS.done/LS.n*100}%"></div></div>
  <div class="card center prompt">${q.prompt}${q.say?'<div class="row" style="justify-content:center"><button class="icon" id="sp">🔊</button><button class="icon" id="sl">🐢</button></div>':''}</div>
  <div>${q.opts.map((o,k)=>`<button class="opt" data-k="${k}">${o.t}</button>`).join("")}</div>`;
  $("#bk").onclick=Learn;
  if(q.say){$("#sp").onclick=()=>say(q.say);$("#sl").onclick=()=>say(q.say,true);if(q.auto)later(()=>say(q.say),350)}
  const btns=view.querySelectorAll(".opt");
  btns.forEach(b=>b.onclick=()=>{
    if(locked)return;locked=true;
    const o=q.opts[b.dataset.k];
    if(o.ok){
      b.classList.add("ok");LS.done++;if(cur.first)LS.right++;LS.combo++;answer(true);
      if(q.after)later(()=>say(q.after),250);
    }else{
      b.classList.add("bad");LS.combo=0;answer(false);
      btns.forEach((x,k)=>{if(q.opts[k].ok)x.classList.add("ok")});
      const ts=LS.types;
      LS.q.push({it:cur.it,type:ts[(ts.indexOf(cur.type)+1)%ts.length],first:false});
      if(q.after)later(()=>say(q.after),250);
    }
    later(practiceStep,1300);
  });
}
function lessonEnd(){
  const l=LESSONS[LS.i],n=LS.n,pct=LS.right/n,pass=pct>=.7;
  const stars=pct>=.95?3:pct>=.8?2:1;let first=false;
  if(pass){
    const old=S.lessons[l.id];first=!old;
    S.lessons[l.id]={stars:Math.max(stars,old?old.stars:0)};
    LS.items.forEach(it=>{if(it.k==="w"&&!S.known.includes(it.en))S.known.push(it.en)});
    gainXP(15+LS.right*3+(first?30:0));
    if(stars>=2){SFX.level();confetti()}else SFX.ok();
  }else SFX.bad();
  save();checkAch();hud();
  const hasNext=LS.i<LESSONS.length-1;
  view.innerHTML=`<div class="card center hero" style="padding:28px 16px"><div class="muted">${l.t}</div>
    <div class="stars">${pass?"⭐".repeat(stars)+"☆".repeat(3-stars):"💪"}</div>
    <div class="big">${LS.right}/${n}</div>
    <div class="muted" style="margin-top:6px">${pass?(first?"Урок пройден! Следующий урок открыт 🎉":"Урок засчитан ✔"):"Нужно набрать минимум 70%. Повторите материал и попробуйте снова."}</div>
    <div class="muted" style="margin-top:4px">Считаются правильные ответы с первой попытки</div></div>
    ${pass&&hasNext?'<div class="row"><button class="btn gold" id="nl">Следующий урок →</button></div>':''}
    <div class="row"><button class="btn ghost" id="rv">📖 Повторить</button><button class="btn" id="pa">🎯 Практика ещё раз</button></div>
    <div class="row"><button class="btn ghost" id="ls">Все уроки</button></div>`;
  if($("#nl"))$("#nl").onclick=()=>startLesson(LS.i+1);
  $("#rv").onclick=()=>{LS.t=0;teachStep()};
  $("#pa").onclick=startPractice;
  $("#ls").onclick=Learn;
}

/* ================= PROFILE ================= */
function Me(){
  const acc=S.stats.a?Math.round(S.stats.c/S.stats.a*100):0;
  view.innerHTML=`
  <div class="card hero center"><div class="muted">Уровень</div><div class="big">${level()}</div>
    <div class="bar"><div style="width:${S.xp%100}%"></div></div><div class="muted">Всего ${S.xp} XP</div></div>
  <div class="games">
    <div class="card center" style="margin:0"><div class="en2">🔥 ${S.streak}</div><div class="muted">дней подряд</div></div>
    <div class="card center" style="margin:0"><div class="en2">${acc}%</div><div class="muted">точность (${S.stats.c}/${S.stats.a})</div></div>
    <div class="card center" style="margin:0"><div class="en2">${S.known.length}</div><div class="muted">слов выучено</div></div>
    <div class="card center" style="margin:0"><div class="en2">${S.fav.length}</div><div class="muted">в избранном</div></div>
  </div>
  <h2>Достижения</h2>
  <div class="ach">${ACH.map(a=>`<div class="a${S.ach.includes(a[0])?" on":""}"><div class="e">${a[1]}</div><b style="display:block;margin-top:4px">${a[2]}</b>${a[3]}</div>`).join("")}</div>
  <h2>Настройки</h2>
  <div class="card">
    <div class="set"><span>🎵 Фоновая музыка</span><button class="sw${S.set.music?" on":""}" id="swM"></button></div>
    <div class="set"><span>Громкость музыки</span><input type="range" min="0" max="100" value="${S.set.mv*100}" id="vM"></div>
    <div class="set"><span>🔔 Звуковые эффекты</span><button class="sw${S.set.sfx?" on":""}" id="swS"></button></div>
    <div class="set"><span>Громкость эффектов</span><input type="range" min="0" max="100" value="${S.set.sv*100}" id="vS"></div>
    <div class="set"><span>🗣 Скорость голоса</span><input type="range" min="50" max="110" value="${(S.set.rate||.9)*100}" id="vR"></div>
    <div class="set"><span>🧪 Проверка звука</span><button class="btn" id="tst" style="padding:9px 16px">Тест</button></div>
    <div class="note" id="diag"></div>
    <div class="set"><span>🎨 Тема</span><div class="themes">
      <button class="th${S.theme==="royal"?" on":""}" data-th="royal" style="background:linear-gradient(135deg,#8b7cff,#e9c46a)"></button>
      <button class="th${S.theme==="emerald"?" on":""}" data-th="emerald" style="background:linear-gradient(135deg,#2dd4a0,#f5d98b)"></button>
      <button class="th${S.theme==="rose"?" on":""}" data-th="rose" style="background:linear-gradient(135deg,#fb7185,#fcd5a5)"></button></div></div>
  </div>
  <div class="row"><button class="btn ghost" id="rst">Сбросить прогресс</button></div>`;
  $("#swM").onclick=()=>{setMusic(!S.set.music);$("#swM").classList.toggle("on",S.set.music)};
  $("#swS").onclick=()=>{S.set.sfx=!S.set.sfx;save();applyVol();$("#swS").classList.toggle("on",S.set.sfx);SFX.pop()};
  $("#vM").oninput=e=>{S.set.mv=e.target.value/100;save();applyVol()};
  $("#vS").oninput=e=>{S.set.sv=e.target.value/100;save();applyVol()};
  $("#vS").onchange=()=>SFX.ok();
  $("#tst").onclick=soundTest;
  $("#vR").oninput=e=>{S.set.rate=e.target.value/100;save()};
  $("#vR").onchange=()=>say("Hello, how are you?");
  view.querySelectorAll(".th").forEach(b=>b.onclick=()=>{S.theme=b.dataset.th;document.documentElement.dataset.theme=S.theme;save();SFX.pop();Me()});
  $("#rst").onclick=()=>{if(confirm("Сбросить весь прогресс?")){Object.assign(S,{known:[],bests:{},lessons:{},xp:0,streak:0,lastDay:"",today:{d:todayStr(),n:0},stats:{a:0,c:0},ach:[],seen:[],fav:[],flags:{}});save();hud();Me()}};
}

hud();render();
</script>
</body>
</html>
